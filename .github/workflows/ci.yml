name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Package test suites run their own tests concurrently; running every package at once
  # oversubscribes the runner and pushes process-spawning tests past their timeouts.
  TURBO_CONCURRENCY: 2

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Set up Turborepo Remote Cache
        # OIDC tokens are unavailable to fork pull requests; those runs fall back to a cold cache.
        if: vars.TURBO_TEAM != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: bun run check
      - run: bun run build
