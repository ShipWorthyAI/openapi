name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Package test suites run their own tests concurrently; running every package at once
  # oversubscribes the runner and pushes process-spawning tests past their timeouts.
  TURBO_CONCURRENCY: 2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: bun run check
      - run: bun run build
