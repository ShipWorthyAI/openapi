name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

env:
  # Package test suites run their own tests concurrently; running every package at once
  # oversubscribes the runner and pushes process-spawning tests past their timeouts.
  TURBO_CONCURRENCY: 2

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      plan-artifact-id: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - id: select
        uses: changesets/action/select-mode@v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: changesets/action/version@v2.1.2
        with:
          script: bun run version-packages
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.select-mode.outputs.plan-artifact-id }}
          path: .release-plan
          merge-multiple: true
      - run: bun run check
      - run: bun run build
      - run: bun run release:pack --from-publish-plan .release-plan/publish-plan.json
      - run: bun run release:verify
      - id: artifacts
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: release-${{ github.sha }}
          path: .release
          retention-days: 30
          if-no-files-found: warn

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          path: .release
          merge-multiple: true
      - uses: changesets/action/publish@v2.1.2
        with:
          script: bun run release
