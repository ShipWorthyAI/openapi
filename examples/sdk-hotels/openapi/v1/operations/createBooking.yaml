operationId: createBooking
summary: Create a booking
description: Create a booking from a quote and saved payment source. Poll the returned booking for updates and reuse the original idempotency key when retrying. The booking holder is the authenticated customer.
tags:
  - Bookings
parameters:
  - $ref: ../parameters/IdempotencyKey.yaml
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          payment_source_id:
            type: string
            description: Existing saved payment source ID owned by the authenticated customer.
            minLength: 1
            pattern: \S
          quote_id:
            $ref: ../schemas/Id.yaml
            description: Identifier of the quote to accept.
          booking_id:
            $ref: ../schemas/Id.yaml
          guests:
            type: array
            minItems: 1
            items:
              $ref: ../schemas/BookingGuest.yaml
        required:
          - payment_source_id
          - quote_id
          - guests
        additionalProperties: false
responses:
  "202":
    description: Successful response.
    headers:
      X-Request-ID:
        description: Correlation identifier for this HTTP attempt.
        schema:
          type: string
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              $ref: ../schemas/Booking.yaml
          required:
            - data
  "400":
    $ref: ../responses/BadRequest.yaml
  "401":
    $ref: ../responses/Unauthorized.yaml
  "403":
    $ref: ../responses/Forbidden.yaml
  "404":
    $ref: ../responses/NotFound.yaml
  "409":
    $ref: ../responses/Conflict.yaml
  "422":
    $ref: ../responses/ValidationProblem.yaml
  "429":
    $ref: ../responses/TooManyRequests.yaml
  "503":
    $ref: ../responses/ServiceUnavailable.yaml
  default:
    $ref: ../responses/UnexpectedProblem.yaml
