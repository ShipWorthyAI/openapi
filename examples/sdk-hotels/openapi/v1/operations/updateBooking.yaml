operationId: updateBooking
summary: Modify a booking
description: "The booking owner can request changes to the holder's name or contact details. Omitted fields remain unchanged. Acceptance does not mean the update has been confirmed."
tags:
  - Bookings
parameters:
  - $ref: ../parameters/BookingId.yaml
  - $ref: ../parameters/IdempotencyKey.yaml
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          holder:
            type: object
            properties:
              first_name:
                type: string
              last_name:
                type: string
              email:
                type: string
                format: email
              phone:
                type: string
        required:
          - holder
        additionalProperties: false
responses:
  "202":
    description: Successful response.
    headers:
      X-Request-ID:
        description: Correlation identifier for this HTTP attempt.
        schema:
          type: string
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              $ref: ../schemas/Booking.yaml
          required:
            - data
  "400":
    $ref: ../responses/BadRequest.yaml
  "401":
    $ref: ../responses/Unauthorized.yaml
  "403":
    $ref: ../responses/Forbidden.yaml
  "404":
    $ref: ../responses/NotFound.yaml
  "409":
    $ref: ../responses/Conflict.yaml
  "422":
    $ref: ../responses/ValidationProblem.yaml
  "429":
    $ref: ../responses/TooManyRequests.yaml
  "503":
    $ref: ../responses/ServiceUnavailable.yaml
  default:
    $ref: ../responses/UnexpectedProblem.yaml
