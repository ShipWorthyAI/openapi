operationId: cancelBooking
summary: Cancel a booking
description: "Request cancellation under the booking's cancellation terms. Cancellation and refund completion are reported separately. The booking remains available after cancellation. Available to the booking owner and explicitly authorized support accounts."
tags:
  - Bookings
parameters:
  - $ref: ../parameters/BookingId.yaml
  - $ref: ../parameters/IdempotencyKey.yaml
responses:
  "202":
    description: Successful response.
    headers:
      X-Request-ID:
        description: Correlation identifier for this HTTP attempt.
        schema:
          type: string
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              $ref: ../schemas/Booking.yaml
          required:
            - data
  "400":
    $ref: ../responses/BadRequest.yaml
  "401":
    $ref: ../responses/Unauthorized.yaml
  "403":
    $ref: ../responses/Forbidden.yaml
  "404":
    $ref: ../responses/NotFound.yaml
  "409":
    $ref: ../responses/Conflict.yaml
  "422":
    $ref: ../responses/ValidationProblem.yaml
  "429":
    $ref: ../responses/TooManyRequests.yaml
  "503":
    $ref: ../responses/ServiceUnavailable.yaml
  default:
    $ref: ../responses/UnexpectedProblem.yaml
