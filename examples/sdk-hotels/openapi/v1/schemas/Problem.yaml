type: object
properties:
  type:
    type: string
    format: uri
    default: about:blank
  title:
    type: string
  status:
    type: integer
    minimum: 400
    maximum: 599
  detail:
    type: string
  instance:
    type: string
  code:
    type: string
  request_id:
    type: string
  errors:
    type: array
    items:
      $ref: ./FieldError.yaml
required:
  - type
  - title
  - status
  - code
  - request_id
