type: object
required:
  - id
  - name
properties:
  id:
    $ref: ./Id.yaml
  type:
    type: string
    description: Room type identifier.
  name:
    type: string
  description:
    type: string
  max_occupancy:
    type: integer
    description: Maximum number of guests allowed in this room.
  remarks:
    type: string
    description: Special remarks related to the booking or room type.
  board:
    type: string
  images:
    type: array
    items:
      $ref: ./Image.yaml
