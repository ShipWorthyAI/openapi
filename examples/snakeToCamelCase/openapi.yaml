openapi: 3.1.0
info:
  title: Hotels naming example
  version: 1.0.0
paths:
  /hotels/{hotel_id}:
    get:
      operationId: getHotel
      parameters:
        - name: hotel_id
          in: path
          required: true
          schema:
            type: string
        - name: include_reviews
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: A hotel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
  /hotels:
    post:
      operationId: createHotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewHotel"
      responses:
        "201":
          description: Created hotel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
components:
  schemas:
    Address:
      type: object
      required: [street_name, postal_code]
      properties:
        street_name:
          type: string
        postal_code:
          type: string
    NewHotel:
      type: object
      required: [display_name, address]
      properties:
        display_name:
          type: string
        address:
          $ref: "#/components/schemas/Address"
    Hotel:
      type: object
      required: [hotel_id, display_name, address]
      properties:
        hotel_id:
          type: string
        display_name:
          type: string
        address:
          $ref: "#/components/schemas/Address"
