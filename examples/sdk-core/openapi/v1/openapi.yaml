# Subset of Core's V6 contract (`/api-docs/v6/swagger.yaml`) plus a placeholder
# `listExampleItems` operation. `../core.overlay.yaml` keeps only `createReservationToken`,
# as the real SDK does with the full document.
openapi: 3.0.1
info:
  title: Core API V6
  version: v6
  description: "Clean, performance-optimized API with standardized patterns"
components:
  schemas:
    ExampleItem:
      $ref: ./schemas/ExampleItem.yaml
    ReservationIdentityToken:
      $ref: ./schemas/ReservationIdentityToken.yaml
  securitySchemes:
    bearerAuth:
      $ref: ./securitySchemes/bearerAuth.yaml
security:
  - bearerAuth: []
paths:
  /api/v6/app/example_items:
    get:
      $ref: ./operations/listExampleItems.yaml
  /api/v6/app/reservations/token:
    post:
      $ref: ./operations/createReservationToken.yaml
servers:
  - url: "https://{defaultHost}"
    variables:
      defaultHost:
        default: app.staging.example.com
  - url: "http://{defaultHost}"
    variables:
      defaultHost:
        default: localhost:3000
