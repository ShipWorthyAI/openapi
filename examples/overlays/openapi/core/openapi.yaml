          description: The body carries no opted_in
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_opted_in
                    - invalid_request
        '403':
          description: The user may not administer this project
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - no_review_engine_access
        '404':
          description: No user or no project answers to those identifiers
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - user_not_found
                    - not_found
        '422':
          description: A location carries a settings row that will not save
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
