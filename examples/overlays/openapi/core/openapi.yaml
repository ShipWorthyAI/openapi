                    type: string
                    enum:
                    - user_not_found
                    - not_found
    patch:
      summary: Turn a project's Google review SMS campaign on or off
      tags:
      - Internal — Command seam
      description: |
        Sets the campaign for every location on the project in one transaction and answers
        with the state it left behind, in the shape the read serves it.

        PATCH rather than PUT because it is the method the portal already uses for this
        toggle. Convergent either way: the body is the whole desired state, so a repeat
        writes nothing the first call did not, and a caller that timed out can simply ask
        again.

        Switching off does not create settings rows for locations that have none. The row
        carries the opt-in and defaults to off, so writing one to say "off" would leave a
