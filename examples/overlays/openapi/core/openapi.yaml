                  nullable: true
                  description: The error, or the operator's own words. Bounded at
                    1,000 characters, with broadcast mentions neutralised. On `declined`,
                    blank becomes the default decline wording.
                check_number:
                  type: string
                  nullable: true
                  description: The check the payment is on. Used by `posted_not_recorded`
                    and `unresolved_claim`, so someone can find the live check.
        required: true
  "/internal/v1/toast/restaurant_lookup":
    post:
      summary: Find the Toast restaurant a location is
      tags:
      - Internal — Toast seam
      description: |
        Resolves one self-serve location to a Toast restaurant GUID, for the two POS routes
        that look one up. It is what writes the answer the confirm step then checks against,
        so nothing else can offer a GUID.

        **Two strategies, in order.** First a pg_trgm similarity search over this monolith's
        `pos_connections` joined to `project_locations` — a restaurant already live on Toast
        with us, matched on city, name similarity ≥ 0.3, and zip/GPS when known. That one is
        not an API call and is why this cannot be a filter on `/internal/v1/pos_connections`:
        that endpoint keys on an exact `external_location_id`, and this is searching for one.
        Failing that, the Toast Partner API — the partner restaurant list, the connected-
        restaurant set, then each candidate's location for address verification.

        **A POST for a read.** Every other Toast read here keys on a restaurant GUID; this is
        what finds the GUID, so it keys on the location's own details instead — including the
        operator's email and street address, which a query string would put in request logs.
        Nothing is written: `bust_cache` drops this monolith's Toast caches and nothing else.

        **Send the stored blob, not a resolved address.** `location_data` and the top-level
        columns are resolved here, by the same code the partner-portal route uses:
        `GooglePlaces::AddressParser` over the entry's `formatted_address`, then a per-field
        fallback that applies to the primary location (index 0) and deliberately not to a
        satellite, whose top-level columns describe the primary. A caller that pre-resolved
        the address would be a second implementation of both rules, and a satellite resolved
        by the wrong one gets handed a sibling location's GUID.

        **`timed_out` is a third outcome, not a kind of failure.** The candidate walk is
        bounded by a six-second server-side budget, checked between Toast calls. When it
        expires, `found` is `false` with `timed_out: true`, and the caller must not count it
        as a miss — a miss walks the operator toward an ops escalation they did not earn.
        Poll again instead: the partner list and every location already fetched are cached
        here for two minutes cluster-wide, so the next call resumes rather than restarting.

        **The candidate is the matcher's answer verbatim.** The partner-portal route also
        sends `name` again as `restaurant_name`; that alias belongs to the funnel's contract
        and is applied by whoever serves it, not here.

        **`bust_cache` belongs to an operator-triggered retry only.** Those caches are what
        hold Toast's rate limit across every pod, so a polling caller must leave it off.

        `400` refuses the payload before any of this runs, and names which field. `500`
        carries `{"error": "internal_error"}`.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and no
        `Content-Type` header — so branch on the status, not the body. This path draws on the
        namespace's shared 600/minute read allowance rather than the 30/minute command
        budget, which is sized for Salesforce writes and not for a route the funnel polls
        every five seconds.
      operationId: lookupToastRestaurant
      parameters: []
      responses:
        '200':
          description: The lookup ran; found says whether it resolved
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - timed_out
                properties:
                  data:
                    type: object
                    required:
                    - found
                    properties:
                      found:
                        type: boolean
                      candidate:
                        type: object
                        description: Present only when found is true.
                        required:
                        - guid
                        - name
                        - source
                        properties:
                          guid:
                            type: string
                          name:
                            type: string
                            nullable: true
                          address:
                            type: string
                            nullable: true
                          city:
                            type: string
                            nullable: true
                          state:
                            type: string
                            nullable: true
                          zip_code:
                            type: string
                            nullable: true
                          source:
                            type: string
                            enum:
                            - existing_connection
                            - partner_api
                            description: Which strategy answered. existing_connection
                              means a restaurant already live with us, and the partner-portal
                              route treats it as proof the platform tender exists.
                  timed_out:
                    type: boolean
                    description: The walk gave up on its budget. Not a miss — poll
                      again.
        '400':
          description: The payload names a field this cannot search on
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_restaurant_name
                    - invalid_location_index
                    - invalid_exclude_guids
                    - invalid_request
        '429':
          description: The read allowance for this calling application is spent. Retry
            with backoff. NOTE this body does not use the seam's envelope — it comes
            from Rack::Attack and carries an `errors` array with no Content-Type header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
        '500':
          description: An unhandled error; the namespace rescues StandardError so
            this keeps the envelope rather than answering an HTML error page
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - internal_error
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - restaurant_name
              properties:
                prospect_id:
                  type: string
                  nullable: true
                  description: The caller's own identifier for the prospect. Logged
                    if the connection search fails; never queried.
                restaurant_name:
                  type: string
                  description: The location's name. Used for the similarity search
                    and the name tiers. A location entry carrying its own name wins
                    over this.
                contact_email:
                  type: string
                  nullable: true
                  description: The operator's email. Matches a Toast record they created
                    themselves, by address or by business domain — the highest-precision
                    tier and the one that costs no extra Toast call. Send the display
                    value, falling back to the account email.
                city:
                  type: string
                  nullable: true
                  description: Primary-location fallback for the city.
                zip_code:
                  type: string
                  nullable: true
                  description: Primary-location fallback for the zip.
                address:
                  type: string
                  nullable: true
                  description: Primary-location fallback for the street.
                latitude:
                  type: string
                  nullable: true
                  description: Primary-location fallback for the latitude.
                longitude:
                  type: string
                  nullable: true
                  description: Primary-location fallback for the longitude.
                location_index:
                  type: integer
                  nullable: true
                  description: Which location to resolve. Absent means the primary
                    (0). Index 0 may fall back per field to the top-level columns
                    above; a satellite may not.
                location_data:
                  type: object
                  nullable: true
                  description: The prospect's stored location blob, forwarded as held.
                    Only `locations[location_index]` is read, and only its `formatted_address`,
                    `address`, `latitude`, `longitude`, `restaurant_name` and `name`.
                exclude_guids:
                  type: array
                  items:
                    type: string
                  nullable: true
                  description: GUIDs already offered and declined. Refused unless
                    every entry is a string.
                bust_cache:
                  type: boolean
                  nullable: true
                  description: Drop this monolith's Toast caches and re-read. Operator-triggered
                    retries only. Only a literal true (or the string "true") counts.
        required: true
  "/internal/v1/pos_providers":
    get:
      summary: List the POS providers the self-serve funnel offers
      tags:
      - Internal — Read seam
      description: |
        The admin-owned provider catalogue, in the shape the funnel's public
        `GET /self-serve/pos-providers` serves it. The Go service re-emits this body
        verbatim on that path, so the two are asserted byte-identical on the Rails side.

        No filter and no id: the whole visible list is the answer, and it is the same
        answer for every caller — which is what makes it safe behind the Go reader's
        URL-keyed, process-wide cache.

        Rows are **presented**, not columns. `icon_url` and `icon_compact` are resolved
        against the SVGs under `public/pos-provider-icons`, which only this app can see,
        so a consumer must not try to derive them from `slug`.

        `hidden` providers are excluded here — `Pos::Provider.visible` is
        `where(hidden: false)` — so the flag is always false on a served row. It is
        carried anyway because the presenter emits it and the shapes must match.

        The last row is always the "Other" option the dropdown needs, appended after the
        label ordering rather than sorted into it. It is the seeded `other` provider when
        one exists and a synthetic stand-in when it does not — and the stand-in carries
        neither `integrated` nor `setup_doc_url`, which is why those two are the only
        optional keys.

        Held for five minutes with an ETag. Shorter than the project aggregate's hour
        because `hidden` is an admin toggle and the operator flipping it is waiting for
        the funnel to agree; the repeat cost is a 304 rather than a full body.
      operationId: listInternalPosProviders
      responses:
        '200':
          description: The visible catalogue, ordered by label, with Other last
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - provider_id
                      - name
                      - slug
                      - label
                      - hidden
                      - icon_url
                      - icon_compact
                      properties:
                        provider_id:
                          type: integer
                          nullable: true
                          description: Null only on the synthetic "Other" row, which
                            has no database record.
                        name:
                          type: string
                          description: The admin-facing name. Not what the dropdown
                            shows.
                        slug:
                          type: string
                          nullable: true
                        label:
                          type: string
                          nullable: true
                          description: The dropdown text, and the sort key.
                        hidden:
                          type: boolean
                          description: Always false on a served row; the scope filters
                            it.
                        icon_url:
                          type: string
                          description: Path under /pos-provider-icons, resolved from
                            the asset set.
                        icon_compact:
                          type: boolean
                          description: True when the row fell back to the generic
                            icon.
                        integrated:
                          type: boolean
                          description: POS-only, and absent on the synthetic "Other"
                            row rather than false.
                        setup_doc_url:
                          type: string
                          nullable: true
                          description: Curated setup guide. Null when the provider
                            has none, absent on the synthetic row.
  "/internal/v1/partner-portal/projects/{slug}":
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
      description: ADMIN ::Project slug, resolved with ::Project.friendly.find — NOT
        the partner_projects.slug the sibling projects endpoint serves.
    get:
      summary: Read the portal header and panel gates for one project
      tags:
      - Internal — Read seam
      description: |
        What the portal renders above its dashboard, and the facts its panels gate on before
        they render at all.

        `passthrough_mode` and `passthrough_enabled` are gates, not labels. The portal drops
        the whole monthly-redemption-target panel unless the mode is
        `based_on_monthly_redemptions`, and hides the passthrough payout card when the
        project is disabled — so a caller that flattens either into a boolean, or omits one,
        removes a panel rather than a field.

        `monthly_redemption_target` resolves through other records rather than reading a
        column, and `last_funded_date` is a date string or null.

        The sibling `/internal/v1/projects/{id}` does not answer this. That route serves the
        `partner_projects` mirror, whose description records that the admin `::Project`'s
        dashboard columns — `is_prefunded`, `disabled`, `passthrough_mode` — are deliberately
        absent from it.

        No user in the path: this is project state rather than a grant. Authorize the user
        through the access route before rendering any of it.
      operationId: readInternalPartnerPortalProjectDetails
      responses:
        '200':
          description: The project header and its panel gates
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'max-age=300, private. Short because these fields decide
                what the partner is shown: the window is how long the old shape survives
                an admin changing it.'
            ETag:
              schema:
                type: string
              description: Derived from the rendered body, not from project.updated_at,
                which does not move when the resolved target does.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - slug
                - name
                - is_prefunded
                - monthly_redemption_target
                - last_funded_date
                - passthrough_enabled
                - passthrough_mode
                additionalProperties: false
                properties:
                  id:
                    type: integer
                    description: Admin ::Project id.
                  slug:
                    type: string
                  name:
                    type: string
                  is_prefunded:
                    type: boolean
                  monthly_redemption_target:
                    type: number
                    nullable: true
                    description: 'Resolved rather than read: the project''s own target,
                      or the one it inherits.'
                  last_funded_date:
                    type: string
                    nullable: true
                    description: ISO-8601 date, or null for a project that has never
                      funded.
                  passthrough_enabled:
                    type: boolean
                    description: False hides the passthrough payout card.
                  passthrough_mode:
                    type: string
                    enum:
                    - disabled
                    - always
                    - based_on_monthly_redemptions
                    description: Gates the monthly-redemption-target panel, which
                      renders only for based_on_monthly_redemptions.
        '404':
          description: No project holds that slug
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '401':
          description: No bearer token, a token from another application, or a token
            carrying a resource owner
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
  "/internal/v1/partner-portal/projects/{slug}/brands":
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
      description: ADMIN ::Project slug, resolved the same way as the header route
        above.
    get:
      summary: Read the brands and locations the portal's filter offers for one project
      tags:
      - Internal — Read seam
      description: |
        The dropdown behind the dashboard's location filter, in the dropdown's own shape so a
        caller can pass this body through rather than restating the ordering and status rules.

        Three surfaces read it, which is why it carries more than a filter needs:

        - the filter itself, which the portal seeds as fully selected on first load;
        - the performance carousel, whose per-location `name`, `neighborhood` and per-brand
          `hero_image_url` are core-Postgres facts no warehouse answers;
        - the expansion of a whole-brand selection into the locations a filtered panel is
          measured over, which the portal sends as an empty value for that brand.

        **The order is the contract.** Locations are sorted active, then paused, then
        inactive, and alphabetically within each group; brands are sorted by their best
        location's status and then by name. The portal renders this list as it arrives and
        does not re-sort, so re-ordering here re-orders what the partner sees.

        `status` is three-valued on purpose. `ProjectLocation` carries more states than that,
        and every one that is neither active nor paused arrives as `inactive` — a partner
        reading the filter does not distinguish `offboarded` from `permanently_closed`.

        A location holding no brand is absent: it has no bucket to group under. That is the
        population the portal has always served, and it is also what the carousel shows,
        because the carousel is filtered by a selection built from this list.

        `project_id` is the one key the portal's own answer does not carry, and a caller
        passing the body through drops it. It is there to be compared: a caller holding this
        body and an access decision for the same slug cannot tell from the slug that the two
        still name one project, because a slug can be freed and given to another.
      operationId: listInternalPartnerPortalProjectBrands
      responses:
        '200':
          description: The brands, each with its locations
          headers:
            Cache-Control:
              schema:
                type: string
              description: max-age=300, private. A location added or paused is an
                operator action, so the window is how long the dropdown keeps offering
                the old list.
            ETag:
              schema:
                type: string
              description: 'Derived from the rendered body: a status lives on the
                location and an image on the brand, so the project''s timestamp does
                not move when either does.'
          content:
            application/json:
              schema:
                type: object
                required:
                - project_id
                - brands
                additionalProperties: false
                properties:
                  project_id:
                    type: integer
                    description: Admin ::Project id of the project this roster is
                      about, the same id the access and header routes name.
                  brands:
                    type: array
                    items:
                      type: object
                      required:
                      - brand_id
                      - brand_name
                      - status
                      - hero_image_url
                      - locations
                      additionalProperties: false
                      properties:
                        brand_id:
                          type: integer
                        brand_name:
                          type: string
                          nullable: true
                          description: 'The brand''s name. Nullable because the column
                            is: nothing validates it, and the presenter forwards whatever
                            the row carries.'
                        status:
                          type: string
                          enum:
                          - active
                          - paused
                          - inactive
                          description: The best status among this brand's locations.
                        hero_image_url:
                          type: string
                          nullable: true
                          description: 'Cloudinary URL at w_1200,c_fit, or null for
                            a brand with no hero image. Per brand, not per location:
                            the carousel renders it for every location the brand holds.'
                        locations:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - name
                            - neighborhood
                            - status
                            additionalProperties: false
                            properties:
                              id:
                                type: integer
                                description: Admin ProjectLocation id — what the warehouse
                                  keys on.
                              name:
                                type: string
                                nullable: true
                                description: The external name where one is set, else
                                  the internal one. Nullable because both columns
                                  are, and a location can be created without either.
                              neighborhood:
                                type: string
                                nullable: true
                                description: The geocoded neighborhood, falling back
                                  to the location's city, then null.
                              status:
                                type: string
                                enum:
                                - active
                                - paused
                                - inactive
        '404':
          description: No project holds that slug
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '401':
          description: No bearer token, a token from another application, or a token
            carrying a resource owner
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
  "/internal/v1/partner-portal/users/{user_id}/projects":
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: integer
      description: The portal user whose roster this is. Anything that is not a bounded
        identifier is answered 404 by the controller rather than left unrouted.
    - name: q
      in: query
      required: false
      schema:
        type: string
      description: Case-insensitive substring match on the project name or slug, the
        same filter the portal search box sends.
    - name: page
      in: query
      required: false
      schema:
        type: integer
      description: 1-based. A page past the end answers an empty list rather than
        an error.
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
      description: Defaults to 100 and is capped at 250, the portal's own bound.
    get:
      summary: Read the projects one portal user may open
      tags:
      - Internal — Read seam
      description: |
        The roster behind the portal's project switcher: every project this user may open,
        ordered by name, with the portal permission slugs each one carries.

        Read it alongside the sibling access route, which answers a different question. This
        endpoint says which projects a user may reach at all; that one says what they may do
        inside one of them. A project listed here is not a project every portal screen will
        open — the roster admits four portal slugs, while most actions require
        `partner_admin_permission`.

        `permissions` is empty for two unrelated populations, and neither means "no access".
        A platform admin reads every project through the admin bypass, which is not a slug. A
        subscriber manager reaches a project through an `is_subscriber_manager` brand
        ownership, holding no portal slug at all — the legacy subscriber-portal users.

        `portal_access` is the refusal the portal renders as a 403, and it is not the same
        fact as an empty list. A user holding a grant over no project sees an empty switcher;
        a user holding no grant anywhere may not open the portal. Both arrive as zero rows.

        `count`, `page`, `prev`, `next` and `last` are this app's pagination metadata, merged
        at the top level exactly as the portal's own endpoint merges them.
      operationId: listInternalPartnerPortalProjects
      responses:
        '200':
          description: The roster
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store. A roster is a grant list, so a withdrawn ownership
                has to leave the switcher on the next read; any max-age here would
                be the window in which it does not.
          content:
            application/json:
              schema:
                type: object
                required:
                - projects
                - is_admin
                - portal_access
                - count
                - page
                - last
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - slug
                      - name
                      - permissions
                      properties:
                        id:
                          type: integer
                          description: Admin ::Project id — what the warehouse keys
                            on.
                        slug:
                          type: string
                          description: Admin ::Project slug, not the partner_projects.slug
                            the sibling projects endpoint serves.
                        name:
                          type: string
                        permissions:
                          type: array
                          description: Portal slugs held on this project. Empty for
                            a platform admin and for a subscriber manager.
                          items:
                            type: string
                  is_admin:
                    type: boolean
                    description: The admin bypass that produced the roster, not a
                      capability. An admin reads every project.
                  portal_access:
                    type: boolean
                    description: False is the portal's 403. Distinct from an empty
                      list, which is a grant over no project.
                  count:
                    type: integer
                    description: Total rows across all pages.
                  page:
                    type: integer
                  prev:
                    type: integer
                    nullable: true
                  next:
                    type: integer
                    nullable: true
                  last:
                    type: integer
                    description: Last page number. 1 when the roster is empty.
        '404':
          description: The user id names nobody, or is not a bounded identifier
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - user_not_found
        '401':
          description: No bearer token, a token from another application, or a token
            carrying a resource owner
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
  "/internal/v1/toast/test_payment":
    post:
      summary: Post the onboarding test payment on a live check
      tags:
      - Internal — Command seam
      description: |
        Posts a **real payment on the operator's real check**, settling its balance against
        the restaurant's own platform tender. A duplicate is a second settled payment on a
        ticket a server may act on, and the restaurant eats it.

        The whole of `SelfServe::ToastTestPayment#call` is behind this one request rather
        than composed from separate reads. The caller holds an idempotency claim across it,
        and every extra hop inside that window is another way for the answer to be lost
        while the payment lands.

        **This side owns no claim and writes no prospect state.** It performs the Toast call
        and reports what it knows. `pos_setup_data` belongs to the caller.

        ## The rule, and it is the only one

        **Release the claim only on a `200` whose `definitely_not_posted` is `true`.**

        Everything else holds: any other status, a timeout, a dropped connection, an
        unparseable body. All of them mean the payment may be on the check. A stuck claim
        costs an ops ticket; a released one costs a second real payment.

        `definitely_not_posted` is computed here from an allowlist rather than left to the
        caller, so the two sides cannot disagree about it. It is `true` for exactly the
        refusals that are certain nothing reached the check — the four that return before
        the payments POST is issued, plus the `4xx` that is Toast declining outright:

        | `reason` | `definitely_not_posted` | Why |
        |---|---|---|
        | `check_not_found` | `true` | the lookup found no open check |
        | `already_paid` | `true` | balance was already zero |
        | `no_tender_guid` | `true` | no platform tender resolvable |
        | `amount_changed` | `true` | refused against the acknowledged amount |
        | `toast_rejected` | `true` | Toast returned a `4xx` — refused outright |
        | `toast_indeterminate` | `false` | a `5xx`, a gateway error or an unexpected `2xx` — **may have landed** |
        | anything else, or absent | `false` | unclassified, so not vouched for |

        A reason this side does not recognise is reported **as the service named it** rather
        than flattened into one that carries a rule, and `definitely_not_posted` is `false`
        for it. Do not key behaviour on `reason`; key it on the boolean.

        ## The amount bound

        The check is **re-resolved here** rather than trusted from the caller's earlier
        lookup, because items may have been rung since and a stale amount would under-pay or
        be rejected. So the balance can move — or the display number can be reused by a
        different order — between what the operator confirmed and what would be posted.

        Send `acknowledged_amount` and this endpoint refuses, **without posting**, when the
        re-resolved balance exceeds it (`reason: amount_changed`, which releases the claim).
        Omitting it applies no bound. An absolute ceiling for an unacknowledged post is not
        implemented here; it is a deliberately open product decision (100K-672).

        `500` carries `{"error": "internal_error"}` and is the ambiguous case — the service
        raises on a Faraday timeout or a dropped connection, and the request may have been
        fully written before the answer was lost. **Hold the claim.** A `400` is refused by a
        gate before any Toast call, but the rule above still applies: only a `200` with
        `definitely_not_posted: true` releases.
      operationId: postToastTestPayment
      parameters: []
      responses:
        '200':
          description: The Toast call completed; read `posted` and, when false, `definitely_not_posted`
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - posted
                    properties:
                      posted:
                        type: boolean
                      payment_guid:
                        type: string
                        nullable: true
                        description: Toast can accept a payment without handing back
                          a readable GUID, so this is null on some successful posts.
                      amount:
                        type: number
                        nullable: true
                      check_number:
                        type: string
                        nullable: true
                      order_guid:
                        type: string
                        nullable: true
                      check_guid:
                        type: string
                        nullable: true
                      validated:
                        type: boolean
                        nullable: true
                        description: Whether the payment was independently seen on
                          the check. Evidence, not a gate — the operator's own confirmation
                          still decides whether the step completes.
                      payment_status:
                        type: string
                        nullable: true
                      check_payment_status:
                        type: string
                        nullable: true
                      validation_error:
                        type: string
                        nullable: true
                      reason:
                        type: string
                        nullable: true
                        description: Present when `posted` is false. May be a value
                          this side does not classify; branch on `definitely_not_posted`.
                      definitely_not_posted:
                        type: boolean
                        description: Present when `posted` is false. True only when
                          nothing reached the check. The only value that may release
                          an idempotency claim.
                      error:
                        type: string
                        nullable: true
        '400':
          description: A gate refused the request before any Toast call
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_guid
                    - invalid_check_number
                    - invalid_acknowledged_amount
                    - invalid_request
        '429':
          description: The 600/minute internal-API budget for this calling application
            is spent. NOTE this body does not use the seam's envelope — it comes from
            Rack::Attack and carries an `errors` array with no Content-Type header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
        '500':
          description: The Toast call raised — a timeout, a dropped connection, an
            unreadable body. Ambiguous; the payment may have landed. Hold the claim.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - internal_error
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - guid
              - check_number
              properties:
                guid:
                  type: string
                  description: The Toast restaurant GUID. Gated against the UUID pattern
                    the partner-portal confirm route applies, because it reaches a
                    Toast request header.
                check_number:
                  type: string
                  description: The check's display number, as the operator typed it.
                    Bounded at 50 characters.
                tender_types:
                  type: array
                  nullable: true
                  description: The stored tender list, so this side need not re-fetch
                    it. Only `name` and `guid` are read, and at most 50 entries. Send
                    nothing and the list is fetched here.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      guid:
                        type: string
                acknowledged_amount:
                  type: number
                  nullable: true
                  description: The amount the operator was shown and agreed to. When
                    the re-resolved balance exceeds it, the post is refused with `reason
                    amount_changed` and nothing is sent to Toast. Must be greater
                    than zero when present.
        required: true
  "/internal/v1/toast/test_payment_validation":
    post:
      summary: Ask Toast whether our payment is on a check
      tags:
      - Internal — Read seam
      description: |
        Answers "did the money actually move?" by reading the check. It is the only
        question that resolves an ambiguous test payment — one where the POST may have
        landed without the answer reaching the caller — and it **never posts anything**.

        A `POST` despite being a read: it is never cacheable, and its parameters include
        payment and order GUIDs that a query string would put into access logs and proxy
        caches.

        ## What `found` means, and what it does not

        `found: true` means a payment against the restaurant's platform tender is on the
        check. **It does not mean the payment settled** — a `VOIDED` or `DENIED` payment is
        still found, because it reached the check and posting another one is still wrong.
        `validated` is the separate question of whether it settled.

        **`found: false` is not evidence that nothing was posted.** `verify_check` treats a
        non-200 from Toast as an empty page, and `fetch_order` rescues a failed read to nil,
        so a Toast that will not answer is indistinguishable here from a payment that is not
        there. **Never release an idempotency claim on `found: false`** — doing so would
        release during a Toast outage, which is exactly the "might have happened" release
        this endpoint exists to avoid. Hold, ask again, and escalate to a human if it stays
        unresolved.

        ## Identifying the check

        Send `order_guid` for the ordinary re-check of a payment already recorded. Send
        `check_number` with no `order_guid` for the recovery path: the order is re-resolved
        from the check number first. One of the two is required.

        `payment_guid` is optional — the payment is recovered by `tender_guid` and `amount`
        when it is absent or matches nothing, because a 200 with no readable GUID still put
        a real payment on a real check.

        This endpoint makes up to two Toast reads two seconds apart, because Toast can lag
        between accepting a payment and serving it back.
      operationId: validateToastTestPayment
      parameters: []
      responses:
        '200':
          description: The read completed; `found` reports whether our payment is
            on the check
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - found
                    - validated
                    properties:
                      found:
                        type: boolean
                        description: A payment against our tender is on the check.
                          False does NOT prove absence — see the description.
                      validated:
                        type: boolean
                        description: The found payment is in a settling state.
                      payment_guid:
                        type: string
                        nullable: true
                        description: The GUID found on the check wins over the one
                          sent, which may have been mis-derived.
                      amount:
                        type: number
                        nullable: true
                        description: The amount of the payment found on the check.
                      payment_status:
                        type: string
                        nullable: true
                      check_payment_status:
                        type: string
                        nullable: true
                      validation_error:
                        type: string
                        nullable: true
        '400':
          description: A gate refused the request before any Toast call
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_guid
                    - invalid_check_reference
                    - invalid_request
        '429':
          description: The 600/minute internal-API budget for this calling application
            is spent. NOTE this body does not use the seam's envelope — it comes from
            Rack::Attack and carries an `errors` array with no Content-Type header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
        '500':
          description: An unhandled error; the namespace rescues StandardError so
            this keeps the envelope rather than answering an HTML error page
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - internal_error
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - guid
              properties:
                guid:
                  type: string
                  description: The Toast restaurant GUID.
                order_guid:
                  type: string
                  nullable: true
                  description: The stored order. Send this or `check_number`.
                check_number:
                  type: string
                  nullable: true
                  description: The stored check display number. Re-resolves the order
                    when `order_guid` is absent — the recovery path for a claim with
                    no recorded post.
                check_guid:
                  type: string
                  nullable: true
                  description: Recovered from the re-resolved order when absent.
                payment_guid:
                  type: string
                  nullable: true
                  description: Optional. The payment is recovered by tender and amount
                    when this is absent or matches nothing on the check.
                tender_guid:
                  type: string
                  nullable: true
                  description: The restaurant's platform tender, used to recover a payment
                    GUID Toast did not hand back.
                amount:
                  type: number
                  nullable: true
                  description: Narrows the tender match to a payment of this amount.
        required: true
  "/internal/v1/partner-portal/users/{user_id}/projects/{slug}":
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: integer
      description: The portal user whose access is being reported. Digits only — anything
        else is answered 404 by the controller rather than left unrouted.
    - name: slug
      in: path
      required: true
      schema:
        type: string
      description: ADMIN ::Project slug, resolved with ::Project.friendly.find — NOT
        the partner_projects.slug the sibling projects endpoint serves.
    get:
      summary: Read one user's portal access to one project
      tags:
      - Internal — Read seam
      description: |
        The authorization verdict the partner portal enforces, so the SPA renders its nav
        from the same rule Rails applies instead of inferring one from a permission list.

        `capabilities` is the only authorization surface. Each key mirrors exactly one Rails
        gate and is named for the portal destination it guards, not the slug set behind it:

        | Capability | Gate |
        | --- | --- |
        | `dashboard` | `Api::V6::PartnerPortal::ApiController#require_project_access` |
        | `reports` | `PartnerPortal::ReportsController#allowable_permission_slugs` |
        | `operations` | `DemandCalendarsController`, via `ApiController` |
        | `marketing` | `PartnerPortal::Marketing::SubscriberReportsController` |
        | `review_engine` | `GoogleReviewSmsOptInsController`, via `ApiController` |
        | `funding` | `FundingController`, via `ApiController` |

        Five of the six resolve to `partner_admin_permission` today and are still six keys on
        purpose — `reports` exposes an override hook built to be widened, and `marketing` does
        not read portal slugs at all.

        `marketing` is the one to read carefully. `SubscriberReportsController` gates twice and
        both must pass. `set_project` admits three ways: a platform admin, a holder of
        partner_admin/operations/marketing on the project, or — its Path 2 — an
        `is_subscriber_manager` brand ownership on a brand in the project, which is how legacy
        subscriber-portal users get in holding no portal slug. `set_accessible_brands` then
        requires that same subscriber-manager brand ownership, with no admin bypass. Passing the
        second gate therefore satisfies the first via Path 2, so the capability tracks brand
        ownership alone: no portal slug admits on its own, and a partner admin and a platform
        admin both get `false` here without one.

        **Every key is always present, explicitly `true` or `false`.** An omitted key means the
        contract broke, not that access was refused.

        `is_platform_admin` and `permission_slugs` are for support triage. Do not gate on them —
        a platform admin already passes every capability but marketing, and reading the slug list
        re-creates the drift this endpoint exists to end.

        A project the caller's user cannot reach returns 200 with every capability false rather
        than 404. Existence is not hidden from a service token that already knows the slug, and
        the distinction is what lets the caller tell "no access" from "dead link". A `user_id`
        that does not resolve is a separate 404 (`user_not_found`), because a stale session
        reference is a caller bug rather than a refusal.
      operationId: readInternalPartnerPortalProjectAccess
      responses:
        '200':
          description: The access verdict
          headers:
            Cache-Control:
              schema:
                type: string
              description: max-age=30, private when any capability is granted; max-age=10,
                private for a full refusal. max-age is the revocation window, not
                a freshness hint — a withdrawn grant stays honoured for exactly this
                long. Refusals are held only briefly so a new grant lands almost immediately,
                but they are held, because denied users are the population that retries.
          content:
            application/json:
              schema:
                type: object
                required:
                - project_id
                - slug
                - name
                - capabilities
                - is_platform_admin
                - permission_slugs
                properties:
                  project_id:
                    type: integer
                    description: Admin ::Project id — what the warehouse keys on.
                  slug:
                    type: string
                    description: Admin ::Project slug.
                  name:
                    type: string
                  capabilities:
                    type: object
                    description: Every key always present and explicitly boolean.
                      A missing key is a broken contract, not a refusal.
                    required:
                    - dashboard
                    - reports
                    - operations
                    - marketing
                    - review_engine
                    - funding
                    additionalProperties: false
                    properties:
                      dashboard:
                        type: boolean
                      reports:
                        type: boolean
                      operations:
                        type: boolean
                      marketing:
                        type: boolean
                      review_engine:
                        type: boolean
                      funding:
                        type: boolean
                  is_platform_admin:
                    type: boolean
                    description: Diagnostic. A platform admin passes every capability
                      except marketing, so this adds no authorization signal. Gate
                      on capabilities instead.
                  permission_slugs:
                    type: array
                    description: Diagnostic. Portal slugs held on THIS project, sorted.
                      Empty for a platform admin with no ownership, and for a subscriber
                      manager holding no portal slug.
                    items:
                      type: string
        '401':
          description: No bearer token, a token from another application, or a token
            carrying a resource owner
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
        '404':
          description: No project matches the slug, or the user id does not resolve
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
                    - user_not_found
                    description: "`not_found` for the project, `user_not_found` for
                      the user — the two are distinguished so a dead user is not read
                      as a refusal."
  "/internal/v1/partner-portal/users/{user_id}/projects/{slug}/marketing/subscriber-reports":
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
      description: The portal user whose subscriber-manager ownerships decide what
        answers.
    - name: slug
      in: path
      required: true
      schema:
        type: string
      description: ADMIN ::Project slug.
    get:
      summary: Read one brand's subscriber exports
      tags:
      - Internal — Read seam
      description: |
        One page of the exports produced for a single brand, newest first, alongside the
        brands this user may switch between.

        `brand_id` is optional and names which brand the page is about. Omitted, it is the
        first brand the user manages by name, which is what the portal opens on. A brand the
        user does not manage is refused rather than answered empty: an empty page reads as "no
        exports yet", which is a different fact.

        Each row carries `zip_password`, the password for the encrypted archive the download
        route links to. That is why this answer is never cached, along with the polling: after
        requesting an export the portal calls this every ten seconds until the count moves.

        `pagination.total_items` counts the whole filtered result rather than the page.
      operationId: listInternalSubscriberReports
      parameters:
      - name: brand_id
        in: query
        required: false
        schema:
          type: integer
        description: Which of the user's brands the page is about. Defaults to the
          first by name.
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: One-based. Defaults to 1.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        description: Defaults to 18, the portal's own page size, and is capped at
          100. A value below 1 reads as the default rather than as an error.
      responses:
        '200':
          description: One page of exports, and the brands to switch between
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store. The portal polls this while an export is being
                built, and the rows carry archive passwords.
          content:
            application/json:
              schema:
                type: object
                required:
                - reports
                - current_brand
                - brands
                - pagination
                additionalProperties: false
                properties:
                  reports:
                    type: array
                    items:
                      type: object
                      required:
                      - guid
                      - report_type
                      - report_date
                      - start_date
                      - end_date
                      - subscribers_count
                      - unsubscribers_count
                      - zip_password
                      - is_outdated
                      additionalProperties: false
                      properties:
                        guid:
                          type: string
                          description: The export's uuid, which is what the download
                            route takes.
                        report_type:
                          type: string
                          enum:
                          - weekly
                          - all_time
                          description: weekly is produced on a schedule; all_time
                            is what this seam's own request builds.
                        report_date:
                          type: string
                          description: ISO-8601 date the export was produced.
                        start_date:
                          type: string
                          description: ISO-8601 date, the first day the export covers.
                        end_date:
                          type: string
                          description: ISO-8601 date, the last day the export covers.
                        subscribers_count:
                          type: integer
                          nullable: true
                        unsubscribers_count:
                          type: integer
                          nullable: true
                        zip_password:
                          type: string
                          nullable: true
                          description: Password for the encrypted archive, stored
                            encrypted and decrypted for this answer.
                        is_outdated:
                          type: boolean
                          description: True once the export no longer covers yesterday,
                            which is what the portal labels stale.
                  current_brand:
                    type: object
                    required:
                    - id
                    - name
                    - has_locations_in_operation
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                        description: Admin ::Brand id.
                      name:
                        type: string
                      has_locations_in_operation:
                        type: boolean
                        description: False once the brand holds no location in operation,
                          which is when the weekly subscriber report stops being produced.
                          The portal renders an indicator from it rather than leaving
                          the partner to wonder why the emails stopped.
                  brands:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - has_locations_in_operation
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                          description: Admin ::Brand id.
                        name:
                          type: string
                        has_locations_in_operation:
                          type: boolean
                          description: False once the brand holds no location in operation,
                            which is when the weekly subscriber report stops being
                            produced. The portal renders an indicator from it rather
                            than leaving the partner to wonder why the emails stopped.
                  pagination:
                    type: object
                    required:
                    - page
                    - per_page
                    - total_items
                    - total_pages
                    additionalProperties: false
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_items:
                        type: integer
                        description: The whole filtered result, not this page.
                      total_pages:
                        type: integer
        '403':
          description: The user manages no brand in this project, or not the one named
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - no_subscriber_access
                    - brand_not_accessible
    post:
      summary: Request an all-time subscriber export
      tags:
      - Internal — Command seam
      description: |
        Enqueues the export for the whole life of the brand and answers immediately. The
        document is mailed to the partner and appears in the list route above when it lands,
        which is what the portal polls for.

        **Not idempotent, and deliberately not made so.** A retry mails a second copy of the
        same export rather than corrupting anything, and a key that collapsed two deliberate
        requests would be the worse failure. Callers should not retry it blind.

        The brand is re-checked against the caller's ownerships here, so a request naming one
        they do not manage enqueues nothing.
      operationId: createInternalSubscriberReport
      parameters: []
      responses:
        '202':
          description: The export was enqueued
          content:
            application/json:
              schema:
                type: object
                required:
                - brand_id
                - brand_name
                additionalProperties: false
                properties:
                  brand_id:
                    type: integer
                  brand_name:
                    type: string
                    description: Echoed because the caller names the brand in what
                      it tells the partner.
        '400':
          description: The request named no brand
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_brand_id
        '403':
          description: The user manages no brand in this project, or not the one named
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - no_subscriber_access
                    - brand_not_accessible
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - brand_id
              properties:
                brand_id:
                  type: integer
                  description: A brand the user manages subscribers for.
        required: true
  "/internal/v1/partner-portal/users/{user_id}/projects/{slug}/marketing/subscriber-reports/{guid}/download":
