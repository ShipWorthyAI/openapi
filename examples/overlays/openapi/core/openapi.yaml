      responses:
        '200':
          description: The brands this user manages subscribers for
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store. This is a grant list, so there is no window in
                which a withdrawn ownership may still be served.
          content:
            application/json:
              schema:
                type: object
                required:
                - brands
                additionalProperties: false
                properties:
                  brands:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - has_locations_in_operation
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                          description: Admin ::Brand id.
                        name:
                          type: string
                        has_locations_in_operation:
                          type: boolean
                          description: False once the brand holds no location in operation,
                            which is when the weekly subscriber report stops being
                            produced. The portal renders an indicator from it rather
                            than leaving the partner to wonder why the emails stopped.
        '403':
          description: The user manages no brand in this project
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - no_subscriber_access
        '404':
          description: No user holds that id, or no project holds that slug
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - user_not_found
                    - not_found
        '401':
          description: No bearer token, a token from another application, or a token
            carrying a resource owner
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
