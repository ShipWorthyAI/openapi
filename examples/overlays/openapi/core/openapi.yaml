  "/internal/v1/onboarding/create_project_brand":
    post:
      summary: Create the admin project and brand for a signed prospect
      tags:
      - Internal — Command seam
      description: |
        Creates the admin `Project` and `Brand` and the records hung off them — the funding
        contract, the modal-exempt setting, the submitter's ownership, the partner-portal
        project, the id push back to Salesforce, and the opportunity's stage transition. The
        Go service owns the funnel but not core, so it asks for this rather than reproducing it.

        **Accepted, not performed.** A first call enqueues the create path and answers `202`
        with `status: "accepted"`, the job id, and the three model ids null — the work has not
        run, so there is nothing to report yet.

        **Read `status`, not the ids.** `partner_project_id` is written in
        `create_partner_portal_models`, with seven steps still to run after it, so it cannot
        mean the run finished. The run's own
        terminal stamp is written only after its last step, and it is what this endpoint reports
        as `status`. The ids are withheld until it lands, so a partial run can never be read as a
        finished one.

        **A replay of a finished run is a `200`** carrying `status: "completed"` and the three
        ids, and enqueues nothing. That makes the command at-least-once safe for a caller that
        cannot tell a lost response from a lost request.

        A retry *before* the run finishes enqueues a fresh run, which is safe because the steps
        guard themselves — the project on `project_id.present?` (a unique slug is the database
        backstop), the setting on `new_record?`, the partner project on `partner_project_id`, and
        the signed-agreement attach on an existing `ContentDocumentLink`. That last one fails
        open, so a Salesforce outage during the dedup read can still file a second copy. The push
        overrides the worker's `on_conflict` to `:log` so a simultaneous duplicate is logged
        rather than dead-lettered.

        **Eligibility is re-checked when the job runs**, not only here, so a prospect archived or
        moved to a settled opportunity between the two moments produces no project and no
        Salesforce writes. The command still answers `202`; the run bails and logs.

        Two of the six `409` reasons (`missing_salesforce_opportunity`, `prospect_has_no_user`) are
        states the create path returns early from, so accepting them
        would leave the caller waiting for a project that is never created. The other four
        (`unsupported_source`, `prospect_archived`, `agreement_not_signed`,
        `opportunity_stage_not_actionable`) are preconditions the create path relies
        on its callers to enforce — a prospect in any of those states must not be created at all.

        `500` carries `{"error": "internal_error"}` — the namespace rescues `StandardError`, so
        an outage no longer answers Rails' HTML error page regardless of the `Accept` header.
        A malformed body is a `400` `{"error": "invalid_request"}` rather than a 500, because a
        Temporal activity retries a 5xx and gives up on a 4xx.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and no
        `Content-Type` header — so branch on the status, not the body. The commands are bounded
        at 30/minute per calling application, well below the 600 the reads share, because each
        accepted command enqueues roughly nineteen Salesforce call sites. Retry with backoff.

        Identifiers are accepted as JSON numbers or as digit-only strings, and anything else is
        refused rather than coerced — `find_by` would cast `"5leavescafe"` to `5` and expand an
        array into an `IN` clause.
      operationId: createOnboardingProjectBrand
      parameters: []
      responses:
        '202':
          description: The command was accepted and the create path is enqueued
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - prospect_id
                    - status
                    - project_id
                    - brand_id
                    - partner_project_id
                    - job_id
                    properties:
                      prospect_id:
                        type: integer
                      status:
                        type: string
                        enum:
                        - accepted
                        description: The run was enqueued. The ids are null until
                          it finishes.
                      project_id:
                        type: integer
                        nullable: true
                        description: Always null here. Reported once the run has finished,
                          on the 200.
                      brand_id:
                        type: integer
                        nullable: true
                        description: The project's primary brand. Always null here;
                          reported on the 200.
                      partner_project_id:
                        type: integer
                        nullable: true
                        description: Always null here. Seven steps still run after
                          it is written, so it never meant the run finished; read
                          status instead.
                      job_id:
                        type: string
                        nullable: true
                        description: Null when the until-executed lock refuses a duplicate
                          push; the command is still accepted.
        '200':
          description: The run already finished; the records are returned and nothing
            is enqueued
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - prospect_id
                    - status
                    - project_id
                    - brand_id
                    - partner_project_id
                    - job_id
                    properties:
                      prospect_id:
                        type: integer
                      status:
                        type: string
                        enum:
                        - completed
                        description: Every pipeline step succeeded and the terminal
                          stamp landed.
                      project_id:
                        type: integer
                        nullable: true
                      brand_id:
                        type: integer
                        nullable: true
                        description: The project's primary brand. On the opp-assisted
                          branch the command adopts an existing Sales-created project,
                          so this carries whatever that project had.
                      partner_project_id:
                        type: integer
                        nullable: true
                      job_id:
                        type: string
                        nullable: true
                        description: 'Always null: a replay enqueues no job.'
        '422':
          description: The identifier is absent, or is neither a number nor a digit-only
            string
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - invalid_identifiers
        '404':
          description: No prospect with that id
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '409':
          description: The prospect is not in a state this command can run for
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_salesforce_opportunity
                    - prospect_has_no_user
                    - unsupported_source
                    - prospect_archived
                    - agreement_not_signed
                    - opportunity_stage_not_actionable
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, from another application,
            or missing entirely
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prospect_id
              properties:
                prospect_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The monolith's numeric SelfServeProspect primary key.
        required: true
  "/internal/v1/onboarding/finalize_locations":
    post:
      summary: Finalize the admin locations for a submitted partner project
      tags:
      - Internal — Command seam
      description: |
        Creates the admin `ProjectLocation`s and everything hung off them. The Go service owns
        the funnel's submit but not this path, so it asks for it rather than reproducing it.

        **Accepted, not performed.** The sync fans out a child job per brand and per location,
        so it is enqueued and the response is a `202` carrying the job id. The caller must poll
        the read endpoints for the resulting locations rather than treating `202` as completion.

        **Repeating the command is safe and is not a conflict.** The sync's unique-job lock
        returns a null `job_id` instead of a jid when it drops a duplicate — the run already
        queued does the work — so a null `job_id` on a `202` still means accepted.

        The three `409` reasons all describe a project the sync would silently do nothing for:
        it fails soft outside `planning`/`raising`, writes nothing when the project is unlinked,
        and its fan-out loop is a no-op with no brands. Each is refused up front because a `202`
        would leave the caller polling for locations that are never coming.

        Identifiers are accepted as JSON numbers or as digit-only strings, and anything else is
        refused rather than coerced — `find_by` would cast `"5leavescafe"` to `5` and expand an
        array into an `IN` clause.
      operationId: finalizeOnboardingLocations
      parameters: []
      responses:
        '202':
          description: The command was accepted and the sync is enqueued
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - partner_project_id
                    - job_id
                    properties:
                      partner_project_id:
                        type: integer
                      job_id:
                        type: string
                        nullable: true
                        description: Null when the unique-job lock dropped this run
                          as a duplicate. Still accepted.
        '422':
          description: An identifier is absent, or is neither a number nor a digit-only
            string
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - invalid_identifiers
        '404':
          description: No partner project with that id
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '409':
          description: The project exists but the sync would do nothing for it
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - project_not_linked
                    - project_status_not_syncable
                    - project_has_no_brands
        '401':
          description: No bearer token, a token carrying a resource owner, or from
            another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - partner_project_id
              - user_id
              properties:
                partner_project_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The monolith's numeric PartnerPortal::Project primary
                    key.
                user_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The acting user, passed through to the sync as its
