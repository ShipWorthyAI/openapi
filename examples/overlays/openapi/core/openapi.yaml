  "/internal/v1/landing_page_content/{key}":
    get:
      summary: Read the landing-page copy a marketing content key resolves to
      tags:
      - Internal — Read seam
      description: |
        The copy behind the growth funnel's `GET /self-serve/lp-content/:key`, which the Go
        partner service serves on this monolith's behalf.

        The tables stay here. They are the admin B2B marketing CMS, written from
        `api/v6/admin/landing_page_variants`, `_keys` and `_content_schemas` and edited
        through the `b2b_marketing` widget. Marketing owns the copy; the funnel reads it.

        **The key is not an id.** It is a marketing content key, normalized by
        `LandingPageKey.normalize` — invalid UTF-8 bytes dropped, surrounding **spaces**
        (and only spaces, never tabs, newlines or NUL) trimmed, then downcased — and then
        matched against `LandingPageKey::KEY_FORMAT`, `/\A[a-z0-9_+~!$(),@:'*-]+\z/`, with a
        300 character ceiling. A key that fails either check answers 404 without a query.
        Dots are excluded deliberately: the public route splits a dotted segment into
        `:format`, so a mapped "key.v2" would serve whoever owns "key".

        **Two 404s, and they are not interchangeable.** `not_found` is an unresolvable,
        unpublished, archived or key-released variant. `inactive` is a published variant
        whose `active` flag is off — content that exists and must not be rendered. The
        funnel renders each differently, so a caller has to read the body, not just the
        status.

        `etag` is the variant's own `cache_key_with_version`, the validator the public route
        hands the browser. It is here so the seam can serve it onward rather than mint one:
        it moves on republish and on nothing else.

        Served `max-age=0, private, must-revalidate`. The reader on the other side has no
        hook on publish or archive, so any lifetime stated here is one a marketing edit
        waits out on top of the window `LandingPages::ContentCache.invalidate` already
        closes on this side. Revalidation costs a 304 off the same cache entry and no query.

        `slots` is the published snapshot, verbatim and unescaped — escaping is the
        consumer's job, as it is on the public route.
      operationId: readInternalLandingPageContent
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: The marketing content key. Normalized and format-checked before
          lookup; see above.
      responses:
        '200':
          description: The published snapshot for a live, active variant
          content:
            application/json:
              schema:
                type: object
                required:
                - etag
                - template_id
                - schema_version
                - slots
                properties:
                  etag:
                    type: string
                    description: The variant validator. Serve it onward rather than
                      minting one.
                  template_id:
                    type: string
                    description: Which content schema the slots conform to.
                  schema_version:
                    type: integer
                    nullable: true
                    description: The schema version captured at publish time.
                  slots:
                    type: object
                    additionalProperties: true
                    description: The published copy, verbatim and unescaped.
        '404':
          description: No servable copy — read the reason, the two are not interchangeable
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
                    - inactive
                    description: "`inactive` is a published variant switched off;
                      `not_found` is everything else."
  "/internal/v1/opportunities/{salesforce_opportunity_id}/identity_verification":
    get:
      summary: Read a user's identity-verification state on an opportunity
      tags:
      - Internal — IDV seam
      description: |
        The state the funnel renders for one user on one opportunity.

        Result-hiding is deliberate: the caller sees the coarse `state`, never Plaid's raw
        pass/fail/review verdict. `hosted_link_url` is present only while a session is in
        flight AND belongs to the named user — a link minted for someone else would make
        this user verify as its owner, so it is withheld.

        `user_id` names who the call acts for. It is re-authorized against the opportunity
        here, with the same policy the partner-facing route applies.
      operationId: readIdentityVerification
      parameters:
