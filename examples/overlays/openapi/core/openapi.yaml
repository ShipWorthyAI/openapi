  "/internal/v1/leads/create_or_update":
    post:
      summary: Upsert a Salesforce Lead
      tags:
      - Internal — Command seam
      description: |
        Creates or updates a Salesforce Lead, deduped by email, on behalf of the Go
        service. It backs the public `POST /self-serve/create-or-update-lead` route,
        which the Go service serves and this monolith performs.

        **Why this is a seam and not a move.** Salesforce is a shared external system
        and this monolith is its single writer for the `Lead` object. The Go service
        records the same constraint from its side, in
        `internal/shared/salesforce/salesforce.go`: that package deliberately exposes
        only a transport and no push, so that becoming a second writer stays an
        explicit decision rather than something a convenience method starts doing. The
        cutover that would move the writer is LEAD-288's. Until then the service
        relays the caller's body here unchanged and returns this response to it.

        **The response is the public route's, verbatim**, because the service passes
        it straight back to the browser. `201` means a Lead was created, `200` that an
        existing one was updated — the same split the public route answers, keyed on
        whether a non-converted Lead already carried that email.

        **Deduping is best-effort by design.** The email lookup fails soft: a
        Salesforce query outage returns no match rather than an error, so the upsert
        takes the create branch and mints a second Lead rather than losing the
        submission. Duplicate-rule enforcement is also suppressed on that create, so
        Salesforce will not block it.

        **`lead_url` may be null** when the Salesforce client cannot report its
        instance URL. The key is always present; branch on the value, not on whether
        it was sent.

        `500` carries `{"error": "internal_error"}`. A malformed body is a `400`
        `{"error": "invalid_request"}` rather than a 500, because the caller retries a
        5xx and gives up on a 4xx.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key,
        and no `Content-Type` header — so branch on the status, not the body. This path
        has its own 30/minute allowance per calling application, apart from the
        onboarding commands, so a burst of lead submissions cannot starve a finalize.
        Retry with backoff.
      operationId: upsertSalesforceLead
      parameters: []
      responses:
        '201':
          description: A Salesforce Lead was created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - lead_id
                    - created
                    - lead_url
                    properties:
                      lead_id:
                        type: string
                      created:
                        type: boolean
                      lead_url:
                        type: string
                        nullable: true
        '200':
          description: An existing Salesforce Lead was updated
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - lead_id
                    - created
                    - lead_url
                    properties:
                      lead_id:
                        type: string
                      created:
                        type: boolean
                      lead_url:
                        type: string
                        nullable: true
        '422':
          description: The body names no email, or names a blank one
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_email
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  description: The lead's email. Sanitised and downcased here, and
                    the key the upsert dedupes on. Blank is a 422.
                first_name:
                  type: string
                  nullable: true
                last_name:
                  type: string
                  nullable: true
                  description: Falls back to first_name, then to "Unknown" — Salesforce
                    requires a last name.
                phone:
                  type: string
                  nullable: true
                  description: Written to both Phone and MobilePhone.
                company:
                  type: string
                  nullable: true
                revenue_range:
                  type: string
                  nullable: true
                website:
                  type: string
                  nullable: true
                street:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                postal_code:
                  type: string
                  nullable: true
                google_rating:
                  type: string
                  nullable: true
                number_of_locations:
                  type: string
                  nullable: true
                  description: Written to both Number_of_Locations__c and EstimatedLocations__c.
                days_of_week:
                  type: string
                  nullable: true
                  description: Folded into the Lead description rather than its own
                    field.
                relationship:
                  type: string
                  nullable: true
                  description: The contact's role. Becomes Title.
                cuisine_type:
                  type: string
                  nullable: true
                  description: Folded into the Lead description rather than its own
                    field.
                establishment_type:
                  type: string
                  nullable: true
                  description: Mapped onto the Service_Type__c picklist. An already-canonical
                    value passes through; an unmapped one omits the field rather than
                    failing the upsert.
                pos_system:
                  type: string
                  nullable: true
                  description: A POS slug, mapped to the Salesforce picklist label.
                    An unknown one omits the field.
        required: true
  "/internal/v1/self_serve_prospects/{slug}/landing_page":
    get:
      summary: Read the rendered self-serve landing page
      tags:
