      summary: Remove one concept from the confirmed grouping
      tags:
      - Internal — Command seam
      description: |+
        **A delete can create a parent row.** With no `operator_confirmed` grouping but an
        `isa_confirmed` one present, this copies the entire ISA grouping into a new
        operator-confirmed grouping — stamping `confirmed_at` and `confirmed_by_user_id` from
        `user_id` and rebuilding every concept and membership — and only then deletes from the
        copy. The ISA's own grouping is left untouched.

        **Memberships are nullified, not deleted.** The locations the concept held become
        unassigned, so the grouping's `complete` goes false until a following confirm
        reassigns them. Nothing about the prospect's locations changes.

        Marks and enqueues the Salesforce reconciliation exactly as the confirm does, outside
        the row lock. It does **not** enqueue website-provider detection — that is a confirm-only
        fan-out.

        Throttled at 30/minute per calling application, with the confirm.

        **The multi-brand gate is enforced here, not by the caller.** `MultiBrand.active_for?`
        reads `app_settings` uncached by design — a kill switch that takes ten minutes to take
        effect is not a kill switch — and it is stateful besides: it returns true for a prospect
        that already has a confirmed grouping whatever the flag says. A flag-read endpoint would
        lose both properties, so the `404 multi_brand_disabled` is produced here and passed
        through unchanged.

