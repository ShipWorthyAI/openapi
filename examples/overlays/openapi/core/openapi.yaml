                          type: string
                        location_count:
                          type: integer
                          description: The locations below, counted.
                        locations:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - name
                            - timezone
                            - operating_hours
                            additionalProperties: false
                            properties:
