  "/internal/v1/partner_project_locations":
    get:
      summary: Find partner-portal locations by Google Place ID
      tags:
      - Internal — Read seam
      operationId: listInternalPartnerProjectLocations
      description: |
        Returns partner_project_locations IDs, not core ProjectLocation IDs — the sibling
        /internal/v1/project_locations answers the core question about the same Google place.

        This is the population SelfServe::DedupCheckService checks second: every
        partner_project_locations row carrying the place id, across all three statuses
        (in_progress, in_review, approved) and whether or not finalize has linked a core
        ::ProjectLocation. No status filter and no join.

        The parameter is named for the portal column, google_address_place_id, not the core
        column google_place_id. Sending the core name is a 400, so a caller that copies the
        sibling's query learns it asked the wrong endpoint instead of being told "no match".

        At most one row. The question is existence; the row is returned rather than reduced
        to a boolean so a caller can check that the answer names the place it asked about.
      parameters:
      - name: google_address_place_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        description: partner_project_locations.google_address_place_id, matched exactly.
      responses:
        '200':
          description: The matching portal location, or an empty list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    type: array
                    maxItems: 1
                    items:
                      type: object
                      required:
                      - id
                      - google_address_place_id
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                          format: int64
                        google_address_place_id:
                          type: string
        '400':
          description: Missing, blank, or non-scalar place ID
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - google_address_place_id_required
  "/internal/v1/toast/check":
    get:
      summary: Verify an open Toast check by its display number
      tags:
      - Internal — Read seam
      description: |
        Walks today's Toast orders for one restaurant looking for a check by the number
        printed on it, and returns what it found.

        **`data` is the monolith's own verification hash verbatim**, so the caller stores
        it and renders it exactly as the partner-portal route does today. When the check is
        found, `details` carries the order and check GUIDs, the display number, the payment
        status, the total, the balance due, the server, the table, and up to ten line
        items.

        **Never cached.** A check's payment state changes second to second, and this is the
        operator's explicit submit rather than a poll.

        **`timed_out` is a third outcome, not a kind of failure.** The walk is up to five
        Toast pages at fifteen seconds each, which no caller with a ten-second write
        timeout can wait for, so it is capped by a server-side budget. When the budget runs
        out, `data` is `{"verified": false}` with **no `error` string** and `timed_out` is
        `true`.

        Two things the caller must do with it:

        1. Do **not** render the not-found text for a `timed_out` answer. "Check #N not
           found in today's Toast orders" tells the operator their check number is wrong,
           which is a lie about a lookup that never finished. Render the retry text the
           partner-portal rescue path uses.
        2. Do **not** charge a `timed_out` answer against the check-verification attempt
           counter, or a slow Toast walks an operator into an ops escalation they did not
           earn.

        A budget-truncated walk is a degraded answer, not an error: retrying is expected
        and cheap, because the caller's next attempt starts a fresh budget.

        `guid` must be a UUID and `check_number` a non-blank string of at most 50
        characters; either being wrong is a `400` rather than a lookup.
      operationId: readToastCheck
      parameters:
      - name: guid
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The Toast restaurant GUID.
      - name: check_number
        in: query
        required: true
        schema:
          type: string
          maxLength: 50
        description: The number printed on the check, as the operator typed it.
      responses:
        '200':
          description: What the walk found, or that it ran out of budget
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - timed_out
                properties:
                  data:
                    type: object
                    required:
                    - verified
                    properties:
                      verified:
                        type: boolean
                      check_number:
                        type: string
                      error:
                        type: string
                        description: Present only when the check was looked for and
                          not found. Never set on a timeout.
                      details:
                        type: object
                        nullable: true
                        description: Present only when verified. The monolith's shape,
                          stored and rendered as-is.
                  timed_out:
                    type: boolean
                    description: The walk was cut short by the server-side budget.
                      Not a failure; retry is expected.
        '400':
          description: The guid or the check number is missing or malformed
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_guid
                    - invalid_check_number
        '500':
          description: An unhandled error reaching Toast — a malformed body, a refused
            connection. Unlike a budget-truncated walk, this is not a retryable degraded
            answer.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - internal_error
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
  "/internal/v1/toast/config":
    get:
      summary: Read which Toast this deployment talks to
      tags:
      - Internal — Read seam
      description: |
        The Toast admin URL an operator is sent to, and whether this deployment is pointed
        at the Toast sandbox.

        **An endpoint rather than a constant on the caller's side.** The admin URL is
        derived from the same secret that decides which Toast every other read in this
        namespace reaches. Two sources could disagree and send an operator to the
        production Toast admin while their lookups ran against sandbox.

        The value changes only on a deploy, so it is cacheable for an hour: one call per
        caller process per hour.

        `sandbox` is always a boolean. An unset secret is `false`, not null — a two-state
        fact must not arrive as three.
      operationId: readToastConfig
      responses:
        '200':
          description: Which Toast this deployment talks to
          headers:
            Cache-Control:
              schema:
                type: string
              description: max-age=3600, private
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - admin_base_url
                    - sandbox
                    properties:
                      admin_base_url:
                        type: string
                        description: Base of the Toast restaurant admin, without the
                          restaurant's GUID.
                      sandbox:
                        type: boolean
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
  "/internal/v1/toast/tender_types":
    get:
      summary: Read a restaurant's Toast alternate payment types
      tags:
      - Internal — Read seam
      description: |
        The alternate payment types Toast has published for one restaurant, and whether
        the platform tender is one of them. Serves the polled status check, GUID confirmation,
        and the operator's explicit re-check.

        **`platform_tender_found` is computed here, not by the caller.** The rule strips
        whitespace before a case-insensitive substring match, so an operator who named the
        tender "Platform Tender" is a match. Two implementations of that would disagree.

        **`tender_types` is the monolith's stored shape verbatim** — already capped at 50
        entries and reduced to `{name, guid}` — so the caller writes it into its blob
        without reshaping.

        **A Toast failure is a `200` with an empty list**, not a `5xx`. That is what both
        partner-portal routes already see, and surfacing an error here would make the
        caller invent a policy this monolith does not have. An empty list is therefore
        ambiguous between "nothing published" and "Toast was unreachable", exactly as it
        is today.

        **This endpoint is where Toast is protected from the caller.** Reads for one GUID
        are serialized on a lock in the shared cache, so however many caller processes
        poll, Toast sees at most one `alternatePaymentTypes` call per GUID per two
        minutes, plus whatever explicit re-checks operators make. The caller's own
        re-check interval is a bound only while the caller is well behaved, and this
        monolith holds the only cluster-shared cache either side has. The empty list a
        failed fetch produces is stored like any other, so a transient Toast failure is
        held for the same two minutes.

        **A read that collides with one already in flight for the same GUID does not
        start a second one.** A poll answers from the stored list — an empty one if
        nothing is stored yet — rather than queueing, and its next poll carries the
        answer. A re-check waits up to 1.5 seconds for the in-flight read to finish and
        then takes its own turn, so its answer is always the last one stored; if it is
        still waiting after that it answers from the stored list without re-checking,
        and the operator can ask again.

        **`refresh=true` is the operator saying "I just published it, look again".** It
        bypasses the cache, answers `no-store`, and replaces what the pollers read.
        Anything other than the literal string `true` is treated as a poll. Use it only on
        an operator-initiated action, never on the poll.

        `guid` must be a UUID. Anything else is a `400` `{"error": "invalid_guid"}` rather
        than a lookup, because the value reaches a Toast request header and a cache key.
      operationId: readToastTenderTypes
      parameters:
      - name: guid
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The Toast restaurant GUID.
      - name: refresh
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
        description: Bypass and replace the two-minute ceiling. Operator-initiated
          re-checks only.
      responses:
        '200':
          description: The published tender types, and whether the platform tender is among them
          headers:
            Cache-Control:
              schema:
                type: string
              description: max-age=120, private — or no-store when refresh=true
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - guid
                    - tender_types
                    - platform_tender_found
                    properties:
                      guid:
                        type: string
                      tender_types:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              nullable: true
                            guid:
                              type: string
                              nullable: true
                      platform_tender_found:
                        type: boolean
        '400':
          description: The guid is missing, not a string, or not a UUID
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_guid
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
  "/internal/v1/onboarding/plaid_payout_account":
    post:
      summary: Point the prospect fund requests at a connected bank account
      tags:
      - Internal — Command seam
      description: |
        Sets `use_for_fund_requests` on one of the prospect's connected bank accounts and
        clears it from whichever account held it.

        **Why a command and not a direct write.** Where the money lands stays in the monolith
        permanently. The flag lives on `connected_bank_accounts`, the validation that keeps one
        payout account per project spans rows the Go service cannot see, and
        `update_related_fund_requests` re-points existing fund requests when the flag moves.

        **Ownership is enforced by construction, not by a check.** The account id is matched
        inside the addressed prospect's own selectable set rather than looked up globally, so
        naming an account on someone else's prospect is `404` and writes nothing. That is also
        why the refusal is `account_not_found` rather than a forbidden: a caller must not be
        able to learn from the response that an id exists elsewhere.

        **The clear and the set happen under the payout surface's locks.** The validation is
        across rows, so unlocked, two concurrent selections both clear and both set, and the
        prospect ends with two payout accounts or none.

        **Repeating is safe.** The write converges — a second call assigns the same flag — and
        `prior_default_id` is what tells the two apart: it equals the account just set when
        nothing moved.

        A `422` `payout_account_rejected` means a sibling opportunity on the same project
        already holds a payout account. No caller on this side can resolve it; an admin has to
        clear the other one. The message is the operator-facing wording.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and no
        `Content-Type` header — so branch on the status, not the body. The six money-path
        routes share a 300/minute allowance per calling application, separate from the
        30/minute the Salesforce commands share, so an hour of funnel traffic cannot starve a
        finalize. Retry with backoff.
      operationId: setOnboardingPayoutAccount
      parameters: []
      responses:
        '200':
          description: The account is the prospect payout account
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - prospect_id
                    - connected_bank_account_id
                    - prior_default_id
                    properties:
                      prospect_id:
                        type: integer
                      connected_bank_account_id:
                        type: integer
                      prior_default_id:
                        type: integer
                        nullable: true
                        description: The account that held the flag before this call,
                          or null if none did. Equal to connected_bank_account_id
                          when the call repeated a selection already in place.
        '404':
          description: No such prospect, or no such account on that prospect
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
                    - account_not_found
        '422':
          description: An id is malformed, or a sibling opportunity already holds
            the payout account
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - invalid_identifiers
                    - payout_account_rejected
                  message:
                    type: string
                    description: Operator-facing wording, present on payout_account_rejected.
        '401':
          description: The token is missing, unknown, or not the partner service
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prospect_id
              - connected_bank_account_id
              properties:
                prospect_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The monolith's numeric SelfServeProspect primary key
                    — the Go service's legacy_id, not its uuid and not the slug.
                connected_bank_account_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The ConnectedBankAccount to pay out to. Must be one
                    of the addressed prospect's own selectable accounts.
        required: true
  "/internal/v1/onboarding/plaid_exchange":
    post:
      summary: Exchange a Plaid public token for the monolith prospect
      tags:
      - Internal — Command seam
      description: |
        Exchanges the operator's Plaid public token, saves the accounts behind it, and mirrors
        them onto the ProjectOpportunity once the prospect has submitted.

        **Why a command and not a direct write.** Banking state stays in the monolith
        permanently — the Plaid credentials, the `connected_bank_accounts` rows, and the
        dual-read mirror that makes a post-submit connection visible in admin and the partner
        portal. None of it has a second writer.

        **This is the one write on this seam that cannot simply be retried.** An exchange mints
        a Plaid Item, and the upsert behind it dedupes on the masked account numbers a re-link
        reports rather than on the token — so a repeat that comes back naming the accounts
        differently leaves the operator holding two connections to one bank. A claim on
        `(prospect, sha256(public_token))` is taken before the exchange and settled with the
        response body, so a caller that lost the first answer is handed that body back.
        `replayed` says which happened.

        **A failure either releases the claim or holds it, and the difference is whether the
        exchange definitely did not happen.** Plaid refusing the token outright releases it —
        nothing was spent, and the same token may be presented again. A timeout, an
        unparseable body and a `5xx` hold it, because each is also what a successful exchange
        whose answer went missing looks like from here. A held claim is not a lockout: a fresh
        Plaid Link session mints a different token, which digests differently and takes a claim
        of its own. That is the recovery, and it is the only one.

        A `409` is the same situation seen from the other side — an earlier request holds the
        claim and its outcome is not known yet. Waiting is correct; exchanging again is not.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and no
        `Content-Type` header — so branch on the status, not the body. The six money-path
        routes share a 300/minute allowance per calling application, separate from the
        30/minute the Salesforce commands share, so an hour of funnel traffic cannot starve a
        finalize. Retry with backoff. A `429` here is safe to retry unchanged: it is
        refused before the claim is taken, so nothing was attempted and the retry is the same
        request rather than a second exchange.
      operationId: exchangeOnboardingPlaidToken
      parameters: []
      responses:
        '200':
          description: The bank is connected, either by this call or by the one it
            repeats
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - success
                    - accounts
                    - replayed
                    properties:
                      success:
                        type: boolean
                      accounts:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                        description: The prospect's active accounts after the exchange,
                          not only the ones this call added.
                      rejected_personal_accounts:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                        description: Present when some — but not all — of the Item's
                          accounts were personal. The connection still succeeded.
                      replayed:
                        type: boolean
                        description: True when this call was answered from an earlier
                          exchange of the same token rather than performing one.
        '409':
          description: An earlier exchange of this token has not settled
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - exchange_in_progress
        '422':
          description: The request is malformed, the opportunity is missing, or the
            accounts were refused
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - invalid_identifiers
                    - missing_public_token
                    - opportunity_missing
                    - personal_accounts_rejected
                    - accounts_not_saved
                  message:
                    type: string
                    description: Operator-facing wording, present on personal_accounts_rejected.
                  code:
                    type: string
                    nullable: true
                  rejected_personal_accounts:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: The accounts refused as personal, so the operator
                      can be shown which bank they picked rather than only that it
                      failed.
        '404':
          description: No prospect with that id
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '502':
          description: Plaid refused the call
          content:
            application/json:
              schema:
