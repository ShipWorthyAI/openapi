  "/internal/v1/projects/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      description: PARTNER project id (partner_projects.id) — not the admin ::Project
        id and not the slug. Digits only.
    get:
      summary: Read a partner project with its brands and locations
      tags:
      - Internal — Read seam
      description: |
        The whole aggregate in one bounded call, N+1-safe however many locations exist.

        Carries the durable core columns of the partner tables. Deliberately absent:
        the admin ::Project's dashboard fields (`is_prefunded`, `disabled`,
        `passthrough_mode`), which are null until the project syncs, and
        `editable_by_user?`, which is per-user authorization and cannot be answered
        for a service token.

        `approved?` is not a field — derive it from `status`, which is the same enum
        at all three levels.
      operationId: readInternalProject
      parameters:
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The project aggregate
          headers:
            ETag:
              schema:
                type: string
              description: Strong validator over the serialized payload, including
                nested brands and locations.
            Cache-Control:
              schema:
                type: string
              description: max-age=3600, private. A nested change moves the ETag,
                so revalidation is a 304.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - slug
                - name
                - status
                - brands
                properties:
                  id:
                    type: integer
                  slug:
                    type: string
                    nullable: true
                    description: Nullable in the schema on both partner_projects and
                      partner_brands.
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                    - in_progress
                    - in_review
                    - approved
                  project_id:
                    type: integer
                    nullable: true
                    description: Admin ::Project link. Null until the project syncs.
                  nation_id:
                    type: integer
                    nullable: true
                  website:
                    type: string
                    nullable: true
                  business_address_one:
                    type: string
                    nullable: true
                  business_address_two:
                    type: string
                    nullable: true
                  business_city:
                    type: string
                    nullable: true
                  business_state:
                    type: string
                    nullable: true
                  business_zip_code:
                    type: string
                    nullable: true
                  brands:
                    type: array
                    description: Sorted by id — the ETag digests this payload, so
                      a row-order change would needlessly bust caches.
                    items:
                      type: object
                      required:
                      - id
                      - slug
                      - brand_name
                      - status
                      - partner_project_id
                      - project_locations
                      properties:
                        id:
                          type: integer
                        slug:
                          type: string
                          nullable: true
                        brand_name:
                          type: string
                        status:
                          type: string
                          enum:
                          - in_progress
                          - in_review
                          - approved
                        partner_project_id:
                          type: integer
                        brand_id:
                          type: integer
                          nullable: true
                          description: Admin ::Brand link. Null before sync.
                        website_url:
                          type: string
                          nullable: true
                        project_locations:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - name
                            - status
                            - partner_brand_id
                            - partner_project_id
                            - pos_complete
                            - partner_stripe_account_id
                            properties:
                              id:
                                type: integer
                                description: PARTNER location id.
                              name:
                                type: string
                              status:
                                type: string
                                enum:
                                - in_progress
                                - in_review
                                - approved
                              partner_brand_id:
                                type: integer
                              partner_project_id:
                                type: integer
                              project_location_id:
                                type: integer
                                nullable: true
                                description: ADMIN ::ProjectLocation link, null before
                                  sync. This is the id the pos_connections endpoint
                                  filters on — not the partner id above.
                              address_line_one:
                                type: string
                                nullable: true
                              address_line_two:
                                type: string
                                nullable: true
                              city:
                                type: string
                                nullable: true
                              state:
                                type: string
                                nullable: true
                              zip_code:
                                type: string
                                nullable: true
                              timezone_name:
                                type: string
                                nullable: true
                              pos_system:
                                type: string
                                nullable: true
                              pos_complete:
                                type: string
                                nullable: true
                                enum:
                                - 'false'
                                - 'true'
                                - skipped
                                description: The enum name, never a JSON boolean.
                                  "skipped" is a third answer, not a synonym for "false".
                                  A location that has never reached the POS step reads
                                  "false" — the column defaults to 0 — so null does
                                  NOT mean unanswered; it only appears once a blank
                                  PUT has written NULL.
                              partner_stripe_account_id:
                                type: integer
                                nullable: true
                                description: Null is what the portal calls a disconnected
                                  location.
        '304':
          description: Not modified — the caller sent a matching If-None-Match
        '401':
          description: No bearer token, a token from another application, or a token
            carrying a resource owner
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
        '404':
          description: No partner project with that id
  "/internal/v1/projects/{project_id}/stripe_accounts":
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: integer
      description: PARTNER project id. Digits only.
    get:
      summary: Read a project's Stripe accounts and the locations each covers
      tags:
      - Internal — Read seam
      description: |
        `project_location_ids` is the coverage a caller would otherwise compute per location,
        so "is every location covered?" costs one call instead of N.

        Every field is a local column. The Stripe-derived fields the portal shows — email,
        business name, bank last-4, `stripe_status` — are deliberately absent: the portal's
        presenter fetches the remote account in its constructor and fires `check_for_warnings`,
        and a cached seam read must not inherit Stripe's latency, rate limits or downtime.

        `stripe_account_id` is the full identifier, not the portal's truncated display form,
        because a service correlating accounts needs the real value. The column is
        `encrypts deterministic: true`, so this serializes in plaintext something the database
        holds encrypted — deliberate for a machine-to-machine caller behind app-scoped auth.
        **Keep it out of logs.**

        Served with no max-age: `confirmed` and the coverage list gate payouts, and a revoked
        or soft-deleted account must not read as confirmed for an hour. Soft-deleted accounts
        are already excluded by the default scope.

        `project_location_ids` are PARTNER location ids — the sibling pos_connections
        endpoint's `location_id` is an ADMIN id.
      operationId: listInternalProjectStripeAccounts
      responses:
        '200':
          description: The project's accounts with their location coverage
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - confirmed
                      - project_location_ids
                      properties:
                        id:
                          type: integer
                        partner_project_id:
                          type: integer
                          nullable: true
                        stripe_account_id:
                          type: string
                          nullable: true
                          description: Null when no Stripe account exists yet.
                        confirmed:
                          type: boolean
                        project_location_ids:
                          type: array
                          items:
                            type: integer
                          description: PARTNER location ids, narrowed to this account's
                            own project and sorted.
  "/internal/v1/project_locations/nearby_brands":
    get:
      summary: List the brand names with a live location near a point
      tags:
      - Internal — Read seam
      operationId: listInternalNearbyBrandNames
      description: |
        Distinct brands.name for live locations within proximity miles of lat/lng, capped at 50.
        This is the brand name, not the project name; the two are separate associations and differ.
        Unlike the fixed-box nearby read, proximity is a caller-set radius in miles using the same
        Geocoder distance search the public funnel endpoint uses. It defaults to 10 when omitted and
        is rejected outside 0.1..100 rather than clamped, because the caller here is a service.
        Ordering is unspecified: the distance sort is cleared before the distinct pluck.
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: proximity
        in: query
        required: false
        schema:
          type: number
          minimum: 0.1
          maximum: 100
          default: 10
        description: Search radius in miles. Defaults to 10.
      responses:
        '200':
          description: Distinct brand names near the point
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    type: array
                    maxItems: 50
                    items:
                      type: string
        '400':
          description: Missing or invalid coordinates, or a proximity outside 0.1..100
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
  "/internal/v1/project_locations/monthly_spending":
    get:
      summary: Read the last 30 days of debit spending at core locations
      tags:
      - Internal — Read seam
      operationId: readInternalProjectLocationsMonthlySpending
      description: |
        ids is a comma-separated list of 1–1000 positive bigint core ProjectLocation IDs.
        Duplicates count once. Sums active, non-deleted debit transactions created at or after
        30.days.ago in Postgres, truncates the total to an integer, then takes its absolute value.
        The amount uses CreditTransaction.amount units, with no conversion to cents.
        Unknown IDs or no matching transactions return zero. Query failures return an error;
        the Go consumer owns any fallback. Does not impose a live-location filter on transactions.
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: string
          pattern: "^[0-9]+(,[0-9]+)*$"
        description: 1–1000 comma-separated IDs, each in 1..9223372036854775807.
      responses:
        '200':
          description: Absolute whole-unit debit total
          content:
            application/json:
              schema:
                type: object
                required:
                - platform_monthly_spending
                additionalProperties: false
                properties:
                  platform_monthly_spending:
                    type: integer
                    format: int64
                    minimum: 0
        '400':
          description: Missing, malformed, or oversized ID list
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '500':
          description: The spending query failed
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - internal_error
  "/internal/v1/project_locations/nearby":
    get:
      summary: Find live core locations in a fixed neighborhood box
      tags:
      - Internal — Read seam
      operationId: listNearbyInternalProjectLocations
      description: |
        Returns core ProjectLocation IDs, not partner_project_locations IDs, ordered by id.
        Only ProjectLocation.live rows are included. project_name is null if no project is attached.
        At most 1000 rows; more matches return 400 too_many_locations rather than a partial list.
        status in the place lookup is ProjectLocation.status (the display label).
        Nearby uses inclusive latitude +/- 0.0725 and longitude +/- 0.0905 degrees.
        These are fixed server-side offsets, not a caller-configurable radius or a distance sort.
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      responses:
        '200':
          description: Matching live locations
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      required:
                      - id
                      - project_id
                      - project_name
                      - latitude
                      - longitude
                      additionalProperties: false
                      properties:
                        id:
                          type: integer
                          format: int64
                        project_id:
                          type: integer
                          format: int64
                          nullable: true
                        project_name:
                          type: string
                          nullable: true
                        latitude:
                          type: number
                          format: double
                        longitude:
                          type: number
                          format: double
        '400':
          description: Missing or invalid filters, or more than 1000 matching locations
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
