  "/internal/v1/onboarding/plaid_link_token":
    post:
      summary: Mint a Plaid Link token for the monolith prospect
      tags:
      - Internal — Command seam
      description: |
        Mints the short-lived token the operator's browser opens the Plaid bank picker with,
        and moves the prospect into `started_onboarding` on the way.

        **Why a command and not a direct call.** The Plaid credentials stay in the monolith
        permanently — `plaid_service` is reached through its client, and nothing re-implements
        Plaid on the other side of the seam. The token is scoped to the prospect's Salesforce
        opportunity, because that is the id every account this connection produces is filed
        under.

        **Retrying is safe, and that is not free.** Minting a second token abandons the first
        rather than duplicating anything, so a caller may retry a `502`. Nothing is written
        that a second call would double.

        The account filter is depository checking/savings only. That is defence in depth:
        Plaid Link has no `holder_category` filter, so the business-vs-personal decision is
        enforced after the exchange, not here.

        A `422` `opportunity_missing` is a Salesforce sync that has not landed yet rather than
        a bad request — the prospect exists and the opportunity it needs does not. Retrying
        once it has is the whole recovery.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and no
        `Content-Type` header — so branch on the status, not the body. The six money-path
        routes share a 300/minute allowance per calling application, separate from the
        30/minute the Salesforce commands share, so an hour of funnel traffic cannot starve a
        finalize. Retry with backoff.
      operationId: createOnboardingPlaidLinkToken
      parameters: []
      responses:
        '200':
          description: A Link token the operator can open the bank picker with
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - link_token
                    - expiration
                    properties:
                      link_token:
                        type: string
                        description: A bearer credential for one Link session. Relay
                          it to the operator; do not log or store it.
                      expiration:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the token stops opening a session, as Plaid
                          reported it.
        '422':
          description: The id is malformed, or the prospect has no Salesforce opportunity
            yet
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - invalid_identifiers
                    - opportunity_missing
        '404':
          description: No prospect with that id
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '502':
          description: Plaid refused the call
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - plaid_unavailable
        '401':
          description: The token is missing, unknown, or not the partner service
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prospect_id
              properties:
                prospect_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The monolith's numeric SelfServeProspect primary key
                    — the Go service's legacy_id, not its uuid and not the slug.
        required: true
  "/internal/v1/onboarding/stripe_account":
    post:
      summary: Give the prospect a Stripe Express account for tip payouts
      tags:
      - Internal — Command seam
      description: |
        Creates the Stripe Express account the prospect's tip payouts land in, and mints the
        single-use link that walks its owner through Stripe's onboarding.

        **Why a command and not a direct call.** The Stripe credentials stay in the monolith
        permanently, along with the payment-gateway kill switch that decides whether the call
        goes through `Payments::Gateway` or straight at the SDK. The account id is persisted on
        the prospect's `tip_payout_data`, which is the monolith's copy of the row.

        **The account is created at most once, and that is enforced under the prospect's row
        lock.** A second Express account for one operator splits their payouts across two, and
        only one of them is the account the platform pays into. So a repeat — including a retry
        of a `502` — reuses the id rather than creating another. The id is also persisted *before*
        the link is minted and kept even if minting fails, because the account exists at Stripe
        either way and forgetting it here is what would create the second one.

        **The link is minted on every call, even when the account is not created.** It is
        single-use and short-lived, so an operator returning to a half-finished setup needs a
        fresh one. It is a credential that walks its bearer into the operator's Stripe
        onboarding: relay it, do not log or store it.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and no
        `Content-Type` header — so branch on the status, not the body. The six money-path
        routes share a 300/minute allowance per calling application, separate from the
        30/minute the Salesforce commands share, so an hour of funnel traffic cannot starve a
        finalize. Retry with backoff.
      operationId: createOnboardingStripeAccount
      parameters: []
      responses:
        '200':
          description: The prospect has a Stripe account, and a link to finish setting
            it up
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - account_id
                    - url
                    properties:
                      account_id:
                        type: string
                        description: The Stripe Express account id, the same on every
                          call for this prospect.
                      url:
                        type: string
                        description: A single-use onboarding link, minted fresh each
                          call. Relay it to the operator; do not log or store it.
        '404':
          description: No prospect with that id
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '422':
          description: The prospect id is absent, or is neither a number nor a digit-only
            string
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - invalid_identifiers
        '502':
          description: Stripe refused the call
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - stripe_unavailable
        '401':
          description: The token is missing, unknown, or not the partner service
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prospect_id
              properties:
                prospect_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The monolith's numeric SelfServeProspect primary key
                    — the Go service's legacy_id, not its uuid and not the slug.
        required: true
  "/internal/v1/onboarding/stripe_status":
    post:
      summary: Report how far the prospect has got through Stripe onboarding
      tags:
      - Internal — Command seam
      description: |
        Reads the prospect's Stripe Express account and reports whether it can receive a
        payout, optionally recording that on the prospect.

        **A POST for what reads like a GET, because the call can write.** `persist` is what
        decides. The monolith's public route carries the same split on the verb — its `GET`
        polls while the operator is still inside Stripe, and its `POST` is what the front end
        sends on return — and the caller reproduces that split in the body so this seam has one
        shape. Serving the public `GET` from a `persist: false` call and the public `POST` from
        a `persist: true` one preserves the behaviour exactly.

        **`connected` needs both halves.** An account whose details are in but that Stripe will
        not charge cannot receive a payout, and neither can one Stripe will charge whose owner
        never finished the form.

        **`read` is the field to branch on before trusting the three booleans.** A prospect
        with no Stripe account yet, and a Stripe call that failed, are both "not connected" and
        neither has a `details_submitted` to report — so those come back null rather than
        false. Publishing them as false would report an operator who is mid-setup as having
        failed Stripe's checks.

        A Stripe failure is a `200` with `read: false`, not an error: the caller is an operator
        polling mid-onboarding, and an outage is not something they can act on.

        **Only a connected account is ever recorded.** Writing `stripe_connected: false` over a
        prospect mid-setup would do the same damage as publishing the false booleans.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and no
        `Content-Type` header — so branch on the status, not the body. The six money-path
        routes share a 300/minute allowance per calling application, separate from the
        30/minute the Salesforce commands share, so an hour of funnel traffic cannot starve a
        finalize. Retry with backoff.
      operationId: readOnboardingStripeStatus
      parameters: []
      responses:
        '200':
          description: The prospect Stripe onboarding state
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - connected
                    - read
                    - details_submitted
                    - charges_enabled
                    - transfers_enabled
                    properties:
                      connected:
                        type: boolean
                        description: charges_enabled AND details_submitted. False
                          whenever read is false.
                      read:
                        type: boolean
                        description: Whether the account was actually read. False
                          for a prospect with no Stripe account and for a Stripe call
                          that failed.
                      details_submitted:
                        type: boolean
                        nullable: true
                      charges_enabled:
                        type: boolean
                        nullable: true
                      transfers_enabled:
                        type: boolean
                        nullable: true
        '404':
          description: No prospect with that id
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '422':
          description: The prospect id is absent, or is neither a number nor a digit-only
            string
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - invalid_identifiers
        '401':
          description: The token is missing, unknown, or not the partner service
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prospect_id
              properties:
                prospect_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The monolith's numeric SelfServeProspect primary key
                    — the Go service's legacy_id, not its uuid and not the slug.
                persist:
                  type: boolean
                  default: false
                  description: Record a connected account on the prospect. Send true
                    only for the return from Stripe, never for a poll.
        required: true
  "/internal/v1/onboarding/link_user":
    post:
      summary: Associate a core user with the monolith prospect
      tags:
      - Internal — Command seam
      description: |
        Claims the monolith's `self_serve_prospect` for a `User`, and runs the fan-out the
        claim owes: the tracker-stage recompute, the presigned-agreement run, and the
        Salesforce push.

        **Why a command and not a direct write.** Identity is the monolith's permanently —
        `users` is a monolith table the Go service has no write on — and every one of those
        three side effects is monolith code. The Go service decides *who is asking* by
        verifying the caller's token; this decides whether that subject may hold the prospect.

        **The claim is a conditional update, not a read-then-write.** Two logins racing on one
        landing page would otherwise both read `user_id` as NULL and the second would overwrite
        the first. `user_id IS NULL` in the WHERE is what decides between them.

        **Three outcomes, two of them a `200`.** The caller that takes the claim and the caller
        that already held it are both linked, and `user_id` in the response names whoever holds
        the prospect either way. `co_owner` is the third: a project co-owner of a renewal is a
        legitimate caller and is let through *without* taking over the first-touch `user_id`,
        so a caller reading only the status would attribute the prospect to the wrong person.
        Anyone else is a `409`.

        Both ids are the monolith's numeric primary keys. For the prospect that is the Go
        service's `legacy_id`, not its uuid and not the slug.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and no
        `Content-Type` header — so branch on the status, not the body. The six money-path
        routes share a 300/minute allowance per calling application, separate from the
        30/minute the Salesforce commands share, so an hour of funnel traffic cannot starve a
        finalize. Retry with backoff.
      operationId: linkOnboardingProspectUser
      parameters: []
      responses:
        '200':
          description: The user holds the prospect, or may legitimately act on it
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - prospect_id
                    - user_id
                    - co_owner
                    properties:
                      prospect_id:
                        type: integer
                      user_id:
                        type: integer
                        description: Whoever holds the prospect, which under co_owner
                          is not the caller.
                      co_owner:
                        type: boolean
                        description: True when the caller was admitted as a project
                          co-owner of a renewal rather than as the holder of the prospect.
        '409':
          description: Another user already holds the prospect
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - already_claimed
        '422':
          description: An id is absent, or is neither a number nor a digit-only string
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - invalid_identifiers
        '404':
          description: No prospect, or no user, with that id
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '401':
          description: The token is missing, unknown, or not the partner service
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prospect_id
              - user_id
              properties:
                prospect_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The monolith's numeric SelfServeProspect primary key
                    — the Go service's legacy_id, not its uuid and not the slug.
                user_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The monolith User the caller authenticated as.
        required: true
