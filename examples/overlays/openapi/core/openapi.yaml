                    as query parameters. `date_range` is required by both reports
                    defined today. `location_ids` is intersected with what the user
                    may read.
                  additionalProperties: true
      responses:
        '202':
          description: Queued; the file arrives by email
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
