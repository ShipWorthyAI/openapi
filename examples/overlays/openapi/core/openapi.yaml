---
openapi: 3.0.1
info:
  title: Example Internal API (Rails↔Go seam)
  version: v1
  description: |
    Read and command surface the Go partner service calls on the Rails monolith.

    **Not a public API.** Mounted at `/internal/v1` rather than under `/api`, and
    reachable only with the partner-service client-credentials token.

    Authentication is a client-credentials bearer token whose application uid matches
    `SECRETS.partner_service.oauth_client_id`, carrying the `partner_service` scope and
    **no resource owner**. A token with a resource owner is rejected even when it
    carries the right scope: these endpoints run as the service, so the credential
    never identifies an end user. A blank configured client id fails closed and denies
    every caller.

    Because the token is not user-scoped, an endpoint that *reports* a user's access
    takes the user id as a path parameter — see the partner-portal project-access route.
    The monolith owns the rule because it is the only place that observes a permission
    write; the Go service still enforces at its own API edge.

    Ids in paths are constrained to digits, and a non-numeric id does not reach the
    controller. Three exceptions are bounded to one path segment and parsed by their
    controller: a project *slug*; the partner-portal project-access user id, where malformed
    input answers 404; and both ids on the partner-portal project-ownership route, where
    malformed, non-positive, or oversized input answers 422. Elsewhere an unrouted path on
    this app answers 500 with an HTML body rather than 404, so callers should send
    well-formed ids rather than probing.
components:
  schemas:
    AgreementLocationDraftEntry:
      type: object
      description: One location from the FE's localStorage draft. Every key is optional;
        the whole array replaces what is stored, so a key omitted here is dropped.
      properties:
        uid:
          type: string
          description: Concept membership is keyed on this. A location sent without
            one cannot be matched to its memberships and is treated as new.
        name:
          type: string
        address:
          type: string
        llc_name:
          type: string
        llc_address:
          type: string
        dba:
          type: string
        annual_revenue:
          type: string
        pos_system:
          type: string
        menu_url:
          type: string
        reservation_url:
          type: string
        open_date:
          type: string
        lease_confirmed:
          type: boolean
  securitySchemes:
    partnerServiceToken:
      type: http
      scheme: bearer
      description: 'Client-credentials access token for the partner-service OAuth
        application (scope: partner_service, no resource owner).'
    hotelsServiceToken:
      type: http
      scheme: bearer
      description: Dedicated Hotels client-credentials token (hotels_service scope,
        no resource owner).
security:
- partnerServiceToken: []
paths:
  "/internal/v1/onboarding/materialize_prospect":
    post:
      summary: Create the monolith's row for a service-originated prospect
      tags:
      - Internal — Command seam
      description: |
        Gives a prospect the Go service originated a `self_serve_prospect` row here, so the
        Salesforce identity chain can run for it.

        **Why it is needed.** `salesforce_opportunity_id` has one producer — `convert_sf_lead!`,
        reached only through `SalesforcePushWorker` / `SalesLeadPushWorker` — and every enqueue
        site for those is keyed on a row in this database. A prospect that exists only in the Go
        service therefore never gets a Lead, never converts, and holds a NULL opportunity id
        forever. That leaves the IDV read unkeyable, the agreement commands unaddressable and the
        Taskray sync blind to it. The row is created here rather than four links of that chain
        being reproduced over there.

        **The Salesforce push is enqueued explicitly.** `after_update :enqueue_salesforce_push`
        fires only when `user_id` changes on an update, and this row is created with it already
        set, so the callback never runs. Relying on it would make the command report success
        having produced nothing.

        **Replays adopt rather than insert.** `service_prospect_id` is the caller's own uuid and
        is recorded in `review_data`. A second call carrying the same uuid returns the row the
        first created with `created: false`; a slug held by a prospect that uuid did not
        originate is a genuine collision — the two sides mint slugs independently — and answers
        `409` rather than adopting a stranger's record.
      operationId: materializeOnboardingProspect
      parameters: []
      responses:
        '201':
          description: The monolith row was created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - prospect_id
                    - slug
                    - created
                    properties:
                      prospect_id:
                        type: integer
                        description: The monolith id the caller stores as its legacy_id.
                      slug:
                        type: string
                      created:
                        type: boolean
                        description: False when this call adopted a row an earlier
                          one created.
        '200':
          description: A replay; the row an earlier call created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - prospect_id
                    - slug
                    - created
                    properties:
                      prospect_id:
                        type: integer
                        description: The monolith id the caller stores as its legacy_id.
                      slug:
                        type: string
                      created:
                        type: boolean
                        description: False when this call adopted a row an earlier
                          one created.
        '409':
          description: The slug names a prospect this caller did not originate
        '422':
          description: |
            The request named no originating prospect, carried an unusable identifier, or named a
            `status` the Salesforce push would defer on forever / a `source` reserved by a partial
            unique index.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - service_prospect_id
              - slug
              - user_id
              - status
              properties:
                service_prospect_id:
                  type: string
                slug:
                  type: string
                user_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                status:
                  type: string
                source:
                  type: string
                restaurant_name:
                  type: string
                contact_name:
                  type: string
                contact_email:
                  type: string
                contact_phone:
                  type: string
                current_step:
                  type: string
                tracker_stage:
                  type: string
                completed_steps:
                  type: array
                  items:
                    type: string
                qualified:
                  type: boolean
                eligible:
                  type: boolean
                landing_page_published:
                  type: boolean
                  nullable: true
                  description: Null while unknown; the column defaults to false, which
                    reads as unpublished.
                ineligibility_reason:
                  type: string
                disqualification_reason:
                  type: string
                annual_revenue_range:
                  type: string
                establishment_type:
                  type: string
                has_lease:
                  type: boolean
                  nullable: true
                  description: Null while the wizard has not asked; false only once
                    the operator answered no.
                google_rating:
                  type: number
                google_place_id:
                  type: string
                google_price_level:
                  type: integer
                google_review_count:
                  type: integer
                location_count:
                  type: integer
                offer_amount:
                  type: integer
                funding_estimate_low:
                  type: integer
                funding_estimate_high:
                  type: integer
                phone:
                  type: string
                pos_system:
                  type: string
                tracking_uid:
                  type: string
                verified_annual_revenue:
                  type: integer
                website:
                  type: string
                address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                zip_code:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                cuisine_type:
                  type: string
                location_data:
                  type: object
                  additionalProperties: true
                offer_data:
                  type: object
                  additionalProperties: true
                brand_data:
                  type: object
                  additionalProperties: true
                review_data:
                  type: object
                  additionalProperties: true
        required: true
  "/internal/v1/leads/instant_connect_alert":
    post:
      summary: Page the specialists that an operator wants to talk now
      tags:
      - Internal — Command seam
      description: |
        Broadcasts to the specialist channel that a visitor asked to speak to someone
        live, on behalf of the Go service. It backs the public `POST
        /self-serve/instant-connect-alert` route, which the Go service serves and this
        monolith performs.

        **Why this is a seam and not a move.** The message broadcasts with
        `<!channel>` and carries a labelled link, and the Go service's own notifier
        (`internal/shared/slack`) escapes `<`, `>` and `&` wholesale as a security
        property. Rendering there would post `&lt;!channel&gt;` as literal text — the
        alert would appear, every test would pass, and nobody would be paged. This
        monolith already splits the two cases correctly, per value rather than per
        message (`SelfServe::SlackMention`), so the trusted template broadcasts while
        the visitor's own fields stay defanged.

        `SelfServe::SlackAlertWorker` also suppresses identical text for an hour and
        keys that window on the **rendered** text, so a second renderer would get its
        own dedupe state and page the channel twice for one event.

        **Send the visitor's fields verbatim.** Every one of them is untrusted and
        every one is defanged here, where it enters the message. Defanging on the
        caller's side as well would change the text the dedupe window is keyed on, and
        one event would claim two slots.

        **Nothing is resolved.** Unlike the landing-flag and POS-help alerts this names
        no prospect, no slug and no user, so there is no record whose absence could
        turn the command into a silent no-op.

        `202` means the page was accepted, including when the dedupe window folded it
        into one already owed — the caller has nothing to do differently either way.
        `503` means nothing reached the queue and the page is still owed; retry with
        backoff. A malformed body is a `400` `{"error": "invalid_request"}` rather than
        a 500, because the caller retries a 5xx and gives up on a 4xx.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key,
        and no `Content-Type` header — so branch on the status, not the body. This path
        has its own 30/minute allowance per calling application, apart from the
        onboarding commands, so a burst of pages cannot starve a finalize.
      operationId: raiseInstantConnectAlert
      parameters: []
      responses:
        '202':
          description: The page was accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - alerted
                    properties:
                      alerted:
                        type: boolean
                        description: 'Always true. It reports that the alert was accepted,
                          not that a message was posted: one the dedupe window folded
                          into an alert already owed is accepted just the same.'
        '503':
          description: Nothing reached the queue; the page is still owed
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - alert_not_queued
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lead_id:
                  type: string
                  nullable: true
                  description: The Salesforce Lead from the create-or-update-lead
                    call that precedes this one. Carried for the audit trail; the
                    message renders lead_url.
                lead_url:
                  type: string
                  nullable: true
                  description: The Salesforce link for that Lead. Its line is omitted
                    when blank.
                first_name:
                  type: string
                  nullable: true
                last_name:
                  type: string
                  nullable: true
                  description: Joined with first_name; the message says "Operator"
                    when both are blank.
                company:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                  description: Joined with city into a parenthesised location, omitted
                    when both are blank.
                revenue_range:
                  type: string
                  nullable: true
                  description: Rendered verbatim, not resolved against a bucket constant.
                phone:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true
                website:
                  type: string
                  nullable: true
                  description: Its line is omitted when blank.
        required: true
  "/internal/v1/onboarding/entity_identifier":
    post:
      summary: Record an EIN with a durable terminal operation receipt
      tags:
      - Internal — Command seam
      operationId: recordOnboardingEntityIdentifier
      description: Requires service credentials. The canonical lowercase UUID operation_id
        is globally unique and scoped to its prospect. Replay returns the original
        applied outcome without mutating again. Rejected tokens remain rejected; cancelled
        tokens never apply. Deploy the receipt migration and Rails endpoints before
        the Go reservation consumer. No EIN or digest is stored in a receipt.
      parameters: []
      responses:
        '422':
          description: 'error: missing_identifiers, invalid_identifiers, invalid_request,
            invalid_ein, location_unavailable, or ein_unverifiable'
        '409':
          description: 'error: entity_identifier_cancelled'
        '401':
          description: Missing or invalid service credentials
        '200':
          description: Original applied receipt; recorded describes the first application
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - prospect_id
                    - operation_id
                    - status
                    - legal_entity_id
                    - location_uid
                    - recorded
                    properties:
                      prospect_id:
                        type: integer
                      operation_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                        - applied
                      legal_entity_id:
                        type: string
                        format: uuid
                      location_uid:
                        type: string
                      recorded:
                        type: boolean
        '404':
          description: Prospect not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prospect_id
              - operation_id
              - ein
              - location_uid
              - legal_name
              properties:
                prospect_id:
                  type: integer
                  minimum: 1
                operation_id:
                  type: string
                  format: uuid
                ein:
                  type: string
                location_uid:
                  type: string
                  maxLength: 64
                legal_name:
                  type: string
        required: true
  "/internal/v1/onboarding/entity_identifier/resolve":
    post:
      summary: Resolve a command or permanently cancel an unseen operation
      tags:
      - Internal — Command seam
      operationId: resolveOnboardingEntityIdentifier
      description: Requires service credentials. Under the application prospect lock,
        returns the terminal receipt or writes a cancellation tombstone. This mutates
        state, not a status read. Receipts never expire. Wrong-prospect tokens return
        invalid_request. Applied includes entity/location/recorded; rejected includes
        error. On server failure retain the Go reservation and retry resolution.
      parameters: []
      responses:
        '404':
          description: Prospect not found
        '401':
          description: Missing or invalid service credentials
        '422':
          description: 'error: missing_identifiers, invalid_identifiers, or invalid_request'
        '200':
          description: Terminal receipt
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - prospect_id
                    - operation_id
                    - status
                    properties:
                      prospect_id:
                        type: integer
                      operation_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                        - applied
                        - rejected
                        - cancelled
                      legal_entity_id:
                        type: string
                        format: uuid
                      location_uid:
                        type: string
                      recorded:
                        type: boolean
                      error:
                        type: string
                        enum:
                        - invalid_ein
                        - location_unavailable
                        - ein_unverifiable
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prospect_id
              - operation_id
              properties:
                prospect_id:
                  type: integer
                  minimum: 1
                operation_id:
                  type: string
                  format: uuid
        required: true
  "/internal/v1/onboarding/agreement_completed":
    post:
      summary: Record a completed agreement step on the monolith prospect
      tags:
      - Internal — Command seam
      description: |
        Journals the `agreement` step on the monolith's `self_serve_prospect` and lets that
        model's `before_save` callbacks run, which is the only thing that writes
        `agreement_signed_at` and `completed_steps_changed_at`.

        **Why a command and not a direct write.** The Go service keeps its own copy of
        `self_serve_prospects` with no write-back, so writing `agreement_signed_at` there would
        make the service's row consistent and leave the monolith's row — the one the Seam 1
        create-project-brand gate, `StrandedProspectRecovery` and `AgreementSignedWorker` all
        read — still NULL. Routing the step through here runs `update!` beside the callbacks
        instead of reproducing one of them and skipping the rest.

        **Address the prospect by the monolith's numeric id.** In the Go service that is
        `legacy_id`, which the 100K-150 backfill sets on every row copied from the monolith and
        which a service-originated prospect does not have. A prospect with no `legacy_id` has no
        monolith row to stamp, so it has no command to send — slugs are minted independently on
        the two sides and would eventually name unrelated rows.

        **Replays converge rather than repeat.** The journal is unioned, so a second call
        assigns the same value, writes nothing, and fans out to nothing. `200` therefore means
        "the agreement is recorded", not "this call recorded it"; the audit event carries which.

        A `200` carrying a null `agreement_signed_at` is the one case worth acting on: the row
        already journalled the agreement without ever being stamped, and `stamp_agreement_signed_at`
        deliberately leaves such a row for a backfill to set to the real signing date rather than
        to `Time.current`. The monolith warns when it answers that way.
      operationId: recordOnboardingAgreementCompletion
      parameters: []
      responses:
        '200':
          description: The agreement is recorded on the monolith prospect
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - prospect_id
                    - agreement_signed_at
                    - completed_steps_changed_at
                    - tracker_stage
                    properties:
                      prospect_id:
                        type: integer
                      agreement_signed_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: Null when the row already journalled the agreement
                          unstamped. The command does not backfill it; see the description.
                      completed_steps_changed_at:
                        type: string
                        format: date-time
                        nullable: true
                      tracker_stage:
                        type: string
                        nullable: true
        '422':
          description: The prospect id is unusable, or the submitted draft grows past
            the location cap
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - invalid_identifiers
                    - location_count_exceeds_cap
        '404':
          description: No prospect with that id
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '401':
          description: No bearer token, a token carrying a resource owner, or from
            another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prospect_id
              properties:
                prospect_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The monolith's numeric SelfServeProspect primary key
                    — the Go service's legacy_id, not its uuid and not the slug.
                locations:
                  type: array
                  description: The FE location draft, persisted alongside the journal
                    because AgreementSignedWorker builds the project chain from location_data.
                    Carried here rather than written by the caller because the persist
                    ends in ConceptGroupingBuilder.prune_stale_locations!, which rewrites
                    three tables the Go schema does not have. Omit it and this command
                    is exactly what it was before.
                  items:
                    "$ref": "#/components/schemas/AgreementLocationDraftEntry"
        required: true
  "/internal/v1/onboarding/agreement_create":
    post:
      summary: Mint or reuse the prospect's Adobe Sign agreement
      tags:
      - Internal — Command seam
      description: |
        Creates the Adobe Sign agreement for a prospect, or hands back the one already in
        flight, and moves the Salesforce Opportunity to `50-Agreement Sent`.

        **Why the monolith mints it.** It holds the Adobe Sign account token and the library
        template id, and it carries the merge-field builder — funding calculation from the
        revenue bucket, per-location slot fields, currency formatting. A second client would
        mean two copies of that builder against one account, and a drift between them means
        two merchants sign different documents.

        **The merge fields arrive in the body.** The Go service is the system of record for
        `self_serve_prospects`, so its copy is the current one. Reading them off the monolith's
        row would mint a contract from whatever that side last saw.

        **`locations` is persisted here, not on the caller's side.** The persist ends in
        `ConceptGroupingBuilder.prune_stale_locations!`, which rewrites
        `self_serve_concept_groupings`, `self_serve_concepts` and `self_serve_concept_locations`
        — three tables with no counterpart in the Go schema. Omit it and nothing about the
        stored locations changes.

        **Replay-safe minting.** A per-prospect lock serializes the draft write and Adobe call.
        Before that call, the monolith stores a recovery id and sends it as Adobe's
        `externalId`; if the HTTP response is lost, a retry resolves the agreement by that id
        instead of creating a second legally binding contract.

        **The stage push goes through `SelfServe::SalesforceStagePushWorker`**, whose
        `stage_regression?` guard is what keeps an `already_signed` result from dragging an
        Opportunity already at 70 or 80 back to 50 and re-firing the SF automations.

        `signer_email` is not accepted: `AdobeSignService` sends only to the prospect's verified
        address, so a field here would suggest an effect it does not have.

        **`signing_url` is null on a fresh mint.** Adobe takes up to 18 seconds to produce one;
        `FetchSigningUrlWorker` collects it and `agreement_status` is where it surfaces.
      operationId: createOnboardingAgreement
      parameters: []
      responses:
        '200':
          description: The agreement exists and the Opportunity stage push is enqueued
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - prospect_id
                    - agreement_id
                    - signing_url
                    - already_signed
                    - location_count
                    properties:
                      prospect_id:
                        type: integer
                      agreement_id:
                        type: string
                        nullable: true
                      signing_url:
                        type: string
                        nullable: true
                        description: Null on a fresh mint — poll agreement_status
                          for it.
                      already_signed:
                        type: boolean
                        description: True when the agreement was already executed,
                          in which case no signing url exists and none is coming.
                      location_count:
                        type: integer
                        nullable: true
        '422':
          description: The identifiers are unusable, the draft grows past the location
            cap, or Adobe Sign refused the mint
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - invalid_identifiers
                    - location_count_exceeds_cap
                    - agreement_creation_failed
        '404':
          description: No prospect with that id
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '429':
          description: The command throttle refused this caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Unhandled error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - internal_error
        '401':
          description: No bearer token, a token carrying a resource owner, or from
            another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - prospect_id
              properties:
                prospect_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  description: The monolith's numeric SelfServeProspect primary key
                    — the Go service's legacy_id, not its uuid and not the slug.
                agreement:
                  type: object
                  description: Contract merge fields, carried rather than read off
                    the row.
                  properties:
                    legal_entity_name:
                      type: string
                    entity_type:
                      type: string
                    signer_title:
                      type: string
                    merchant_address:
                      type: string
                    state_of_incorporation:
                      type: string
                    signer_name:
                      type: string
                locations:
                  type: array
                  description: The FE location draft. Omit to leave stored locations
                    untouched.
                  items:
                    "$ref": "#/components/schemas/AgreementLocationDraftEntry"
        required: true
  "/internal/v1/onboarding/agreement_status":
    get:
      summary: Poll Adobe Sign for one agreement's status
      tags:
      - Internal — Read seam
      description: |
        Asks Adobe Sign what has happened to an agreement, and mirrors the answer onto
        `review_data["adobe_agreement_status"]` on the way past.

        **There is no Adobe webhook.** Nothing pushes a signature to either side, so whoever
        polls owns signature detection. This is that poll; the caller runs it on a loop until
        `signed` is true and then sends the completion command.

        **A read across the seam rather than a moved one** for the same reason the mint is: the
        Adobe account token lives on the monolith and gains a second holder if it does not.

        **The answer is `no-store`.** The seam reader caches by URL and revalidates on a TTL,
        and a signature the partner has just applied must not wait one out.

        `signing_url` comes off the row rather than from Adobe: `FetchSigningUrlWorker` writes
        it there once Adobe has produced one, up to 18 seconds after the mint. It is null until
        then, which is not an error.
      operationId: readOnboardingAgreementStatus
      parameters:
      - name: prospect_id
        in: query
        required: true
        description: The monolith's numeric SelfServeProspect primary key.
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
      - name: agreement_id
        in: query
        required: true
        description: The Adobe Sign agreement id. Bounded and separator-free because
          it is interpolated into the provider URL's path.
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
      responses:
        '200':
          description: The provider's current status for that agreement
          headers:
            Cache-Control:
              description: Always no-store. The caller's seam reader caches by URL,
                and a signature just applied must not wait out a TTL.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - prospect_id
                    - agreement_id
                    - status
                    - signed
                    - signing_url
                    properties:
                      prospect_id:
                        type: integer
                      agreement_id:
                        type: string
                      status:
                        type: string
                        description: Adobe's own status string, or UNKNOWN when it
                          reported none.
                      signed:
                        type: boolean
                        description: status == "SIGNED".
                      signing_url:
                        type: string
                        nullable: true
        '422':
          description: The prospect id is unusable, or the agreement id is invalid
            for the prospect
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - invalid_identifiers
                    - invalid_agreement_id
                    - agreement_id_mismatch
        '404':
          description: No prospect with that id
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '502':
          description: Adobe Sign could not be reached, or answered unsuccessfully
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - agreement_provider_unavailable
        '500':
          description: Unhandled error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - internal_error
        '401':
          description: No bearer token, a token carrying a resource owner, or from
            another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
  "/internal/v1/onboarding/agreement_document":
    get:
      summary: Read the credit purchase agreement
      tags:
      - Internal — Read seam
      description: |
        The contract the self-serve funnel presents, served so the Go service can render
        it without holding a copy. Rails renders the archived PDF from the same file; a
        second hand-maintained copy is the defect this read exists to prevent, which is
        why the document is opaque here rather than described key by key.

        `digest` is a SHA-256 of that file and is the validator to hand a downstream
        caller. It is in the body as well as the ETag header on purpose: Rails wraps a
        `fresh_when` validator in a weak ETag of its own, so reading the header back would
        propagate Rails' wrapper rather than the digest of the file.

        Served `max-age=0` deliberately: a deploy that changes the contract has to reach
        the operator on their next read, or for that window the document signed and the
        document archived disagree. Revalidation costs a 304, not the body.
      operationId: readInternalAgreementDocument
      parameters:
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The agreement document and its digest
          headers:
            ETag:
              schema:
                type: string
              description: Weak validator Rails derives from the digest. Send it back
                as If-None-Match.
            Cache-Control:
              schema:
                type: string
              description: max-age=0, private, must-revalidate. Every read revalidates;
                a match costs a 304.
          content:
            application/json:
              schema:
                type: object
                required:
                - digest
                - data
                properties:
                  digest:
                    type: string
                    description: SHA-256 of the agreement file. Changes only when
                      the document changes.
                  data:
                    type: object
                    description: The agreement document verbatim. Deliberately not
                      described key by key — a schema of the contract would be the
                      second copy this endpoint exists to avoid. Pass the bytes through
                      rather than re-serializing them.
        '304':
          description: Not modified — the caller sent a matching If-None-Match
        '401':
          description: No bearer token, a token from another application, or a token
            carrying a resource owner
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
  "/internal/v1/onboarding/transfer_bank_accounts":
    post:
      summary: Move an onboarding operator bank accounts onto their opportunity
      tags:
      - Internal — Command seam
      description: |
        Re-points the `ConnectedBankAccount`s an operator linked during onboarding from their
        prospect onto the resolved `ProjectOpportunity`, and stamps the opportunity's
        `bank_info_collection_method`. Both tables stay monolith-owned, so the Go service asks
        for this at submit rather than writing them.

        It matters because there are two read surfaces for a bank account, prospect-scoped and
        opportunity-scoped, and admin reads only the opportunity one. Left on the prospect, the
        funding the operator connected is invisible to admin after submit.

        **The opportunity and source accounts are resolved from the caller's identifiers, not
        from a prospect row.** A prospect the Go service originated has no row here to read
        them from, so `connected_bank_account_ids` carries the exact rows to move and
        `salesforce_opportunity_id` and `project_id` identify the destination — the same pair
        `GET /internal/v1/opportunities/idv` takes, and the same resolution
        `SelfServeProspect#resolved_project_opportunity` performs. At least one is required.

        **Repeating the command is safe.** The move is an UPDATE converging on a target, not an
        insert: a replay finds nothing left on the prospect, reports `transferred_count` `0`,
        and writes nothing the first call did not. That is what makes it replayable across a
        dropped response, unlike a Salesforce POST.

        **A `0` is never the answer to "no such deal".** When the identifiers resolve no
        opportunity the command refuses with `409`, because across the seam a silent zero is
        indistinguishable from a successful move. `transferred_count` `0` with a `200` means
        the deal was found and every named account was already attached to it.

        Identifiers are accepted as JSON numbers or as digit-only strings, and anything else is
        refused rather than coerced — `find_by` would cast `"5leavescafe"` to `5` and expand an
        array into an `IN` clause.
      operationId: transferOnboardingBankAccounts
      parameters: []
      responses:
        '200':
          description: The deal resolved and the transfer ran
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - project_opportunity_id
                    - transferred_count
                    - source
                    properties:
                      project_opportunity_id:
                        type: integer
                      transferred_count:
                        type: integer
                        description: Accounts moved by this call. Zero on a replay,
                          and zero when every named account is already attached.
                      source:
                        type: string
                        enum:
                        - account_ids
        '422':
          description: Neither opportunity identifier was given, or one is not the
            shape a lookup takes
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - missing_identifiers
                    - missing_account_ids
                    - invalid_identifiers
        '404':
          description: A connected_bank_account_id names no account
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - accounts_not_found
        '409':
          description: The identifiers resolved no opportunity
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - opportunity_not_found
        '401':
          description: No bearer token, a token carrying a resource owner, or from
            another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                salesforce_opportunity_id:
                  type: string
                  nullable: true
                  description: The deal id. Required unless project_id is given.
                project_id:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9223372036854775807
                  nullable: true
                  description: The monolith's numeric Project primary key. Required
                    unless salesforce_opportunity_id is given.
                connected_bank_account_ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854775807
                  description: The monolith ConnectedBankAccount rows to move. Required
                    because a Go-originated prospect has no monolith prospect row
                    to discover them from.
        required: true
  "/internal/v1/prospects/{prospect_id}/connected_bank_accounts":
    parameters:
    - name: prospect_id
      in: path
      required: true
      schema:
        type: integer
      description: The monolith's numeric primary key — not the prospect slug and
        not the Go service's uuid. Digits only.
    get:
      summary: Read the bank accounts a prospect can fund from
      tags:
      - Internal — Read seam
      description: |
        Every account is `active`; the monolith filters each branch it serves this from.

        Served with `max-age=0` deliberately. The submit gate reads this, and an operator who
        has just connected a bank must not be told they have none, so the reader revalidates
        against the ETag — the repeat cost is a 304 rather than a full body.

        `connectable_type` decides whose copy of a mirrored account a row is: an account hangs
        off either the prospect or its opportunity, and `use_for_fund_requests` is written on
        one surface and read from the other (see 100K-252).
