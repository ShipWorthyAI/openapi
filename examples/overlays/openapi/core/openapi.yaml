    post:
      summary: Email one partner report to the acting user
      tags:
      - Internal — Command seam
      description: |
        Queues the worker the portal's own export button queues: it rebuilds the report on the
        replica and mails it as a CSV attachment. Uncapped, which is what makes it the answer
        to the CSV endpoint's 413.

        The recipient is the user named in the path and cannot be asked for. That user reached
        here from a verified token on the caller's side; an address in the body would not have,
        and this worker attaches a project's whole transaction history to what it sends.

        Filters travel in the body under `filters`, the shape the portal's own export uses. They
        are validated while the caller is still listening — the worker rebuilds the report
        itself, so a filter it would reject has to fail here rather than in Sidekiq.
