  "/internal/v1/partner-portal/users/{user_id}/projects/{slug}/reports/{report_name}":
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: integer
      description: 'The portal user the report is read AS. Digits only — anything
        else is answered 404 by the controller rather than left unrouted. Not a filter:
        see the note on the `user_id` query parameter.'
    - name: slug
      in: path
      required: true
      schema:
        type: string
      description: ADMIN ::Project slug, resolved with ::Project.friendly.find — NOT
        the partner_projects.slug the sibling projects endpoint serves.
    - name: report_name
      in: path
      required: true
      schema:
        type: string
        enum:
        - credit_transactions
        - passthrough_transactions
      description: A report key from the monolith catalogue. The enum is the catalogue
        as it stands; anything outside it is 404 `report_not_found`, so a name cannot
        reach an arbitrary Ruby constant.
    - name: date_range[start_date]
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Required by both reports defined today. Inclusive, and widened
        to the start of the business day in UTC on this side, so a caller must not
        pre-shift it.
    - name: date_range[end_date]
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Required by both reports defined today. Inclusive, widened to the
        end of the business day. Earlier than the start date is 400, not an empty
        result.
    - name: location_ids[]
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer
      description: 'ADMIN project_location ids. Intersected with what the user may
        read, never trusted: naming a location the user cannot reach narrows the answer
        to nothing rather than widening it. Omitted means every location the user
        may read.'
    - name: transaction_types[]
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - redemption
          - refund_redemption
      description: credit_transactions only. Defaults to both. A value outside the
        enum is 400. passthrough_transactions defines no such filter, so a value sent
        there is dropped rather than refused.
    - name: user_id
      in: query
      required: false
      schema:
        type: integer
      description: The DINER whose transactions to show — a different person from
        the path `user_id`, which is the partner reading the report. The two namespaces
        are kept apart on this side; sending neither is the normal case.
    - name: employee_id
      in: query
      required: false
      schema:
        type: integer
    - name: dining_type
      in: query
      required: false
      schema:
        type: string
        enum:
        - take_out
        - delivery
        - dine_in
    - name: exclude_passthrough
      in: query
      required: false
      schema:
        type: boolean
      description: credit_transactions only. Defaults to including passthrough rows.
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Offset page, 1-based. A page past the end is an empty page, not
        an error; one that is not a positive integer, or that starts past the first
        50,000 rows, is 400 `invalid_filters`.
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Defaults to 18 and is capped at 100. A non-positive or unparseable
        value falls back to the default.
    - name: sort_by
      in: query
      required: false
      schema:
        type: string
        enum:
        - transaction_time
        - amount
      description: Anything else leaves the report's own order in place rather than
        refusing — a sort key is a display preference, and getting it wrong must not
        cost the caller their rows.
    - name: sort_dir
      in: query
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
      description: Defaults to desc, including for an unrecognised value.
    get:
      summary: Read one partner report's rows
      tags:
      - Internal — Read seam
      description: |
        Kept apart from the 400 as the portal keeps them: a missing required filter is a
        request the caller can fix by adding one, while a value that will not coerce is
        malformed. Neither is a 5xx, so a retrying caller gives up rather than looping on an
        input that can never succeed.
      operationId: readInternalPartnerPortalReport
      responses:
        '200':
          description: One page of report rows
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                type: object
                required:
                - columns
                - rows
                - total_count
                - count
                - page
                - last
                properties:
                  columns:
                    type: array
                    description: 'The report''s columns in display order. Authoritative:
                      the keys present on a row are these plus `id`.'
                    items:
                      type: object
                      required:
                      - key
                      - header
                      properties:
                        key:
                          type: string
                        header:
                          type: string
                        format:
                          type: string
                          description: Present only when the column declares one.
                  rows:
                    type: array
                    description: 'One object per row: `id` plus one key per column.
