  "/internal/v1/partner-portal/users/{user_id}/projects/{slug}/report-schedules":
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: integer
      description: The portal user acting. Recorded as the author on a create, and
        the subject of the access check on every call. Digits only — anything else
        is answered 404 by the controller rather than left unrouted.
    - name: slug
      in: path
      required: true
      schema:
        type: string
      description: ADMIN ::Project slug, resolved with ::Project.friendly.find — NOT
        the partner_projects.slug the sibling projects endpoint serves.
    get:
      summary: List a project's scheduled report emails
      tags:
      - Internal — Read seam
      description: |
        Every schedule on the project, newest first, whoever created it. A schedule belongs to
        the project rather than to its author: it outlives their ownership and mails addresses
        that need no account here.

        **The schedules stay in the monolith**, for the reason the reports do and one more: a
        schedule is only a row until something runs it, and what runs it is a Kubernetes CronJob
        on this side that hands `ReportSchedule.due` to Sidekiq every five minutes.

        `Cache-Control: no-store` — the payload carries recipient addresses, and the read is a
        single indexed query, so there is nothing a cache would save.
      operationId: listInternalPartnerPortalReportSchedules
      responses:
        '200':
          description: The project's schedules
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                type: object
                required:
                - schedules
                properties:
                  schedules:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - report_name
                      - frequency
                      - time_period
                      - run_hour
                      - timezone
                      - filters
                      - emails
                      - is_active
                      - is_system
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          description: The partner's own label for the schedule.
                        report_name:
                          type: string
                          enum:
                          - credit_transactions
                          - passthrough_transactions
                        frequency:
                          type: string
                          enum:
                          - daily
                          - weekly
                          - bi_weekly
                          - monthly
                        time_period:
                          type: string
                          enum:
                          - yesterday
                          - last_7_days
                          - last_2_weeks
                          - last_4_weeks
                          - last_3_months
                          - last_6_months
                          description: The window each run covers, resolved against
                            the schedule's own timezone and always ending yesterday.
                            A schedule stores no date range of its own.
                        run_hour:
                          type: integer
                          minimum: 0
                          maximum: 23
                        run_day:
                          type: integer
                          nullable: true
                          minimum: 1
                          maximum: 28
                          description: Monthly only, and clamped to 28 so every month
                            has the day.
                        timezone:
                          type: string
                          description: IANA name. An unknown one falls back to UTC
                            at run time.
                        filters:
                          type: object
                          description: The report's own filters minus the date range.
                            `location_ids` is intersected with the project's branded
                            locations on every write.
                          additionalProperties: true
                        include_new_locations:
                          type: boolean
                          description: When set, each run resolves the project's locations
                            afresh rather than using the stored list, so a location
                            opened after the schedule was made is covered.
                        emails:
                          type: array
                          items:
                            type: string
                          description: Recipients. Plain addresses — they need no
                            account here, which is why the permit list that reaches
                            them is the narrow one.
                        is_active:
                          type: boolean
                        is_system:
                          type: boolean
                          description: Created by this app rather than by a partner.
                            A partner may silence one and nothing else, and may not
                            delete it.
                        last_sent_at:
                          type: string
                          format: date-time
                          nullable: true
                        next_run_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_by:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            email:
                              type: string
                        created_at:
                          type: string
                          format: date-time
                          nullable: true
        '403':
          description: The user holds no reports permission on the project
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - forbidden
        '404':
          description: No such project or user
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
                    - user_not_found
                    - schedule_not_found
                    description: "`not_found` for the project, `user_not_found` for
                      the acting user, `schedule_not_found` for an id that is not
                      on this project. Distinguished so a stale reference is not read
                      as a refusal."
    post:
      summary: Create a scheduled report email
      tags:
      - Internal — Command seam
      description: |
        The author is the user the path names, not the service: the row records who asked for
        these emails, and the credential this runs on names nobody.

        `filters.location_ids` is intersected with the project's branded locations before the row
        is written. Naming one the project does not have keeps the rest of the request; naming
        only such locations resolves to nothing rather than to everything.
      operationId: createInternalPartnerPortalReportSchedule
      parameters: []
