          type: string
          minLength: 1
      responses:
        '200':
          description: The rendered landing page
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '404':
          description: No published landing page for that slug
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
  "/internal/v1/self_serve_prospects/{slug}/landing_progress":
    get:
      summary: Read the self-serve landing page generation progress
      tags:
      - Internal — Read seam
      operationId: readInternalLandingProgress
      description: |
        The payload PartnerPortal::SelfServe::LandingPagesController#progress renders, served on
        the same terms as the landing page read: data is SelfServe::LandingPageProgressPresenter's
        output verbatim, forwarded rather than re-serialized.
        Looked up on slug alone, deliberately. This is what the funnel polls while the page is
        still being generated, so an unpublished prospect is the case it exists to report on
        rather than one to refuse — ready and pipeline_step are how it reports that. Applying the
        sibling's published gate would answer 404 for the whole window the progress screen is on.
        A slug matching no prospect is a 404 carrying the public route's body, "Not found".
        Unlike the landing page read this records nothing.
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: The generation progress
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '404':
          description: No prospect with that slug
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
  "/internal/v1/opportunities/idv":
    get:
      summary: Read an opportunity's identity-verification signal
      tags:
      - Internal — Read seam
      description: |
        Answers whether the prospect's opportunity has a terminal IDV result, so the Go
        service does not have to duplicate either the opportunity-resolution rule or the
        definition of "terminal".

        Cacheability is asymmetric on purpose. A positive is terminal and cached for an
        hour — but only when BOTH keys are supplied, because a single-key match can be
        superseded by a newer sibling opportunity. A negative is returned `no-store`: the
        prospect verifies minutes later, and a cached negative would keep them blocked for
        the reader's whole TTL.

        At least one key is required. Supplying both is strongly preferred.
      operationId: readOpportunityIdv
      parameters:
      - name: salesforce_opportunity_id
        in: query
        required: false
        schema:
          type: string
      - name: project_id
        in: query
        required: false
        schema:
          type: string
        description: Admin project id, as a digit string.
      responses:
        '200':
          description: The signal. A null timestamp means not yet verified, which
            is not an error.
          content:
            application/json:
              schema:
                type: object
                required:
                - idv_submitted_at
                properties:
                  idv_submitted_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Null when unverified. Treat a whitespace-only string
                      as unverified too.
        '422':
          description: Neither key supplied, or a key of the wrong shape
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
  "/internal/v1/pos_connections":
    get:
      summary: List POS connections by external location id, or by owning location
      tags:
      - Internal — Read seam
      description: |
        Filtered by query rather than nested, because the owning location is polymorphic and
        the existence check callers need is by `external_location_id`, which has no owner in
        the path. Exactly one of the two filters is required — the endpoint refuses to dump
        the table, and refuses both filters together.

        **`location_id` is an ADMIN id.** `PosConnectable` is included only by `::Project` and
        `::ProjectLocation`, never by the PartnerPortal models, so a caller holding a project
        aggregate must pass its `project_location_id` (the admin link, null before sync) and
        not the location's own id. Note the asymmetry with the stripe_accounts endpoint, whose
        `project_location_ids` are PARTNER ids — different numbers for the same location.

        There is no status column. `live` is its own boolean, and `live_pos_connections` is
        `where(live: true)`, which does **not** match a NULL row — so a null must be read as
        false rather than as a third state.

        Capped at 100 rows with no pagination. Both filters are narrow enough that the cap is
        unreachable in practice, so a full page means something is wrong upstream.
      operationId: listInternalPosConnections
      parameters:
      - name: external_location_id
        in: query
        required: false
        schema:
          type: string
        description: The existence check behind pos_connection_ready?. Mutually exclusive
          with the location filter.
      - name: pos_provider_id
        in: query
        required: false
        schema:
          type: integer
        description: Optional narrowing of the external-id filter — two providers
          can share an external id.
      - name: location_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - Project
          - ProjectLocation
      - name: location_id
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Matching connections, ordered by id
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - default
                      - live
                      properties:
                        id:
                          type: integer
                        location_id:
                          type: integer
                          nullable: true
                          description: ADMIN id. Null for an unattached connection.
                        location_type:
                          type: string
                          nullable: true
                          enum:
                          - Project
                          - ProjectLocation
                          -
                        pos_provider_id:
                          type: integer
                          nullable: true
                        default:
                          type: boolean
                        live:
                          type: boolean
                          description: 'Nullable column; a null reads as false, matching
                            where(live: true).'
                        external_location_id:
                          type: string
                          nullable: true
        '400':
          description: No filter, both filters at once, or a non-numeric id
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - conflicting_filters
                    - filter_required
                    - invalid_pos_provider_id
                    - invalid_location_id
                    - invalid_location_type
  "/internal/v1/onboarding/pos_help_alert":
    post:
      summary: Raise a POS help alert
      tags:
      - Internal — Command seam
      description: |
        Pages the channel for an operator who asked for help with their POS setup. The Go
        service owns the ops-review flag but cannot build this message: it resolves the
        prospect's contact line, which falls back to the linked user's name and email, and
        that service has no user read.

        **The caller decides whether to alert**, and does so only after its own flag write
        is durable — an alert for a flag that did not land sends someone looking for an
        ops-queue entry that is not there.

        **Repeating the command does not page twice.** `SelfServe::SlackAlertWorker.notify`
        suppresses identical text for an hour, and a retry of one command builds the same
        message, so that dedupe already covers it. This endpoint adds none of its own.

        **There is no body fallback.** The landing-flag alert accepts the record's own
        answers because it fires at the lead stage, where this monolith holds no prospect
        row. A help request only happens deep in onboarding, where the row exists on both
        sides, so a slug naming no prospect is a `404` rather than a stage this side has
        not reached. `slug` is accepted only as a string: `find_by` raises on a hash and
        expands an array into an `IN` clause, which would page about a prospect the caller
        never named.

        **`pos_system` is forwarded verbatim**, including blank. The caller owns
        `pos_setup_data` now, so this monolith's copy of the blob may lag it, and resolving
        here instead would make the seam and the partner-portal route page differently for
        the same prospect. The caller resolves it the way the monolith does
        (`pos_setup_data["pos_system"] || pos_system || "Unknown"`, Ruby `||`, so a stored
        empty string wins), which is why a blank value reaches the message as one.

        `500` carries `{"error": "internal_error"}`. A malformed body is a `400`
        `{"error": "invalid_request"}` rather than a 500, because a Temporal activity retries
        a 5xx and gives up on a 4xx.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and no
        `Content-Type` header — so branch on the status, not the body. This path has its own
        30/minute allowance per calling application, separate from the 30/minute the two
        Salesforce commands share, so a burst of help requests cannot starve a finalize.
        Retry with backoff.
      operationId: raisePosHelpAlert
      parameters: []
      responses:
        '202':
          description: The alert was raised
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - slug
                    properties:
                      slug:
                        type: string
        '404':
          description: The slug names no prospect, or was not sent as a string
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - slug
              properties:
                slug:
                  type: string
                  description: The prospect's slug.
                pos_system:
                  type: string
                  nullable: true
                  description: The operator's effective POS, as the caller resolved
                    it. Capitalised into the message; forwarded verbatim, blank included.
                description:
                  type: string
                  nullable: true
                  description: What the operator is stuck on. Quoted in the message,
                    with broadcast mentions neutralised. Blank becomes "Operator requested
                    help".
        required: true
  "/internal/v1/onboarding/multi_location_alert":
    post:
      summary: Raise a Multi-Location Lead alert
      tags:
      - Internal — Command seam
      description: |
        Pages the channel for an operator who answered that they run more locations than
        the self-serve cap allows. Those leads cannot finish the self-serve funnel, so
        Sales pick them up by hand, and this page is how they learn there is one to pick up.

        The Go service owns the flag write for its cohort but cannot build this message:
        it resolves the prospect's contact line, which falls back to the linked user's
        name and email, and that service has no user read.

        **The caller decides whether an alert is warranted**, and raises one only after
        its own flag write is durable. Answering "no" raises nothing.

        **This monolith's own prospect wins when the slug names one.** Its columns are
        the ones onboarding reads, and its contact line resolves a linked user without
        the caller naming one. For the Go cohort there is no row here at all, which is
        what the body fields serve; `restaurant_name` is what makes the message
        buildable, so a body carrying none is a `404` alongside a slug that names
        nothing. `slug` is accepted only as a string: `find_by` raises on a hash and
        expands an array into an `IN` clause, which would page about a prospect the
        caller never named.

        **`user_id` is how the 42% case still carries contact details.** Most prospects
        have blank `contact_name` and `contact_email`, and the linked user is the only
        name and email there is. It is accepted only as a single id for the same reason
        as `slug` — an array would put an unrelated person into a page about this
        restaurant. A user that resolves to nothing is not an error: the message says
        "No contact info" rather than being dropped.

        **Repeating the command does not page twice.** `SelfServe::SlackAlertWorker`
        suppresses identical text for an hour, and a retry of one command builds the same
        message, so that dedupe already covers it. This endpoint adds none of its own,
        and a suppressed duplicate still answers `202`.

        `503` means the alert reached no queue and is still owed — retry it. `500` carries
        `{"error": "internal_error"}`. A malformed body is a `400`
        `{"error": "invalid_request"}` rather than a 500, because a Temporal activity
        retries a 5xx and gives up on a 4xx.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and no
        `Content-Type` header — so branch on the status, not the body. This path has its own
        30/minute allowance per calling application, separate from the 30/minute the two
        Salesforce commands share, so a burst of flags cannot starve a finalize. Retry with
        backoff.
      operationId: raiseMultiLocationAlert
      parameters: []
      responses:
        '202':
          description: The alert was raised, or the dedupe window already covered
            it
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - slug
                    properties:
                      slug:
                        type: string
        '404':
          description: No prospect here, and the body carried no name — or the slug
            was not a string
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '503':
          description: The alert reached no queue; repeat the request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - alert_not_queued
        '400':
          description: The request body is not valid JSON
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_request
        '429':
          description: The 30/minute alert budget for this calling application is
            spent. Retry with backoff. NOTE this body does not use the seam's envelope
            — it comes from Rack::Attack and carries an `errors` array with no Content-Type
            header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
        '500':
          description: An unhandled error; the namespace rescues StandardError so
            this keeps the envelope rather than answering an HTML error page
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - internal_error
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - slug
              properties:
                slug:
                  type: string
                  description: The prospect's slug.
                restaurant_name:
                  type: string
                  nullable: true
                  description: The name the message leads with. Required when this
                    monolith holds no prospect for the slug; ignored when it does.
                city:
                  type: string
                  nullable: true
                  description: Ignored when this monolith holds the prospect.
                state:
                  type: string
                  nullable: true
                  description: Ignored when this monolith holds the prospect.
                contact_name:
                  type: string
                  nullable: true
                  description: The prospect's own contact name. Wins over the named
                    user's.
                contact_email:
                  type: string
                  nullable: true
                  description: The prospect's own contact email. Wins over the named
                    user's.
                contact_phone:
                  type: string
                  nullable: true
                  description: The prospect's own contact phone.
                user_id:
                  type: integer
                  nullable: true
                  description: The linked monolith user, whose name and email fill
                    in for blank contact columns. A single id or nothing.
        required: true
  "/internal/v1/onboarding/pos_failure_alert":
    post:
      summary: Raise the Slack alert a failed POS route raises
      tags:
      - Internal — Command seam
      description: |
        Pages the channel when one of the Toast-dependent POS routes fails. The Go
        service owns those routes but cannot build the message: it names the prospect's
        contact line, which falls back to the linked user's name and email, and that
        service has no user read.

        **The caller names the stage, not the wording.** `stage` says what it was doing;
        this side owns how that reads in Slack, so the seam and the partner-portal route
        cannot drift into two wordings of one event. A stage this side has no wording for
        is a `400` `{"error": "invalid_stage"}`, answered before the prospect is looked
        up so it cannot be mistaken for a missing prospect.

        | `stage` | Raised when |
        |---|---|
        | `guid_fetch` | The restaurant-GUID lookup failed |
        | `guid_confirm` | Confirming the chosen GUID failed |
        | `check_verification` | Verifying the operator's check failed |

        **Alert on your own failures too.** These three routes alert on any unhandled
        error, which includes the caller's own blob writes, not only a failed call into
        this seam. An endpoint that alerted when *it* failed would cover only half the
        failure surface.

        **Repeating the command does not page twice.** `SelfServe::SlackAlertWorker.notify`
        suppresses identical text for an hour, and a retry of one command builds the same
        message, so that dedupe already covers it. This endpoint adds none of its own.

        **There is no body fallback.** These failures only happen deep in onboarding,
        where the prospect row exists on both sides, so a slug naming no prospect is a
        `404`. `slug` is accepted only as a string: `find_by` raises on a hash and expands
        an array into an `IN` clause, which would page about a prospect the caller never
        named.

        **`error` is yours, so it is treated as untrusted.** Broadcast mentions are
        neutralised and the text is bounded at 1,000 characters before it reaches the
        message.

        `500` carries `{"error": "internal_error"}`. A malformed body is a `400`
        `{"error": "invalid_request"}` rather than a 500, because a Temporal activity
        retries a 5xx and gives up on a 4xx.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and
        no `Content-Type` header — so branch on the status, not the body. This path has
        its own 120/minute allowance per calling application, sized for an outage rather
        than a click: the GUID lookup is polled every five seconds, so ten concurrent
        operators failing on every poll is 120/minute. Past that, copies of one outage are
        shed. Retry with backoff.
      operationId: raisePosFailureAlert
      parameters: []
      responses:
        '202':
          description: The alert was raised
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - slug
                    properties:
                      slug:
                        type: string
        '400':
          description: The stage is missing or one this side has no wording for
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_stage
                    - invalid_request
        '429':
          description: The 120/minute alert budget for this calling application is
            spent. Retry with backoff. NOTE this body does not use the seam's envelope
            — it comes from Rack::Attack and carries an `errors` array with no Content-Type
            header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
        '500':
          description: An unhandled error; the namespace rescues StandardError so
            this keeps the envelope rather than answering an HTML error page
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - internal_error
        '404':
          description: The slug names no prospect, or was not sent as a string
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - slug
              - stage
              properties:
                slug:
                  type: string
                  description: The prospect's slug.
                stage:
                  type: string
                  enum:
                  - guid_fetch
                  - guid_confirm
                  - check_verification
                  description: Which POS route failed. Decides the icon and the headline.
                error:
                  type: string
                  nullable: true
                  description: What went wrong. Neutralised and truncated before it
                    reaches Slack.
        required: true
  "/internal/v1/onboarding/pos_test_payment_alert":
    post:
      summary: Raise a POS test-payment alert
