        required: true
  "/internal/v1/onboarding/landing_flag_alert":
    post:
      summary: Raise a landing-page operator-flag alert
      tags:
      - Internal — Command seam
      description: |
        Sends one of the four Slack alerts the landing page's operator flags raise. The Go
        service owns the flag write but cannot build these messages: each resolves the
        prospect's contact line, which falls back to the linked user's name and email, and
        that service has no user read.

        **The caller decides whether to alert.** The unsupported-POS flag pages only the
        first time, and that "first time" is a read of the caller's own copy of `review_data`.
        This endpoint is told to alert, not asked to work out whether to.

        **Repeating the command does not page twice.** `SelfServe::SlackAlertWorker`
        suppresses identical text for an hour, and a retry of one command builds the same
        message, so that dedupe already covers it. This endpoint adds none of its own. A
        repeat the window suppresses is a `202` like a first delivery: the caller sends this
        command with an idempotency key derived from its body, and a replay of a key already
        honoured is not a failure.

        **A `503` means the alert reached no queue.** The enqueue is the one step this endpoint
        will not swallow: nothing is owed to Slack yet, so it answers `{"error":
        "alert_not_queued"}` and the caller repeats the request. The caller retries a `429` or a
        5xx with exponential backoff and full jitter, up to 3 attempts, bounded by the budget it
        gives the whole command — so a monolith that stays down still loses the page, and that
        loss is logged on both sides rather than reported to the operator.

        `500` carries `{"error": "internal_error"}`. A malformed body is a `400`
        `{"error": "invalid_request"}` rather than a 500, because a Temporal activity retries a
        5xx and gives up on a 4xx. `slug` is accepted only as a string for the same reason:
        `find_by` raises on a hash and expands an array into an `IN` clause, answering for a
        prospect the caller never named.

        **A slug this monolith holds no prospect for is served from the body.** The caller
        splits this stage into its own table, so `restaurant_name` (plus `city`, `state` and
        the `contact_*` answers) is what makes the alert buildable there; without it the
        request is a `404`. A prospect, when one exists, always wins — its contact line
        resolves through a linked user the caller cannot see.

        `429` is the one response that does NOT use this envelope: Rack::Attack answers
        `{"errors": [{"error_type": "rate_limit", ...}]}` — an array, a different key, and no
        `Content-Type` header — so branch on the status, not the body. This path has its own
        120/minute allowance per calling application, separate from the 30/minute the two
        Salesforce commands share, so a burst of flags cannot starve a finalize. Retry with
        backoff.
      operationId: raiseLandingFlagAlert
      parameters: []
      responses:
        '202':
          description: The alert was raised
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - slug
                    - flag
                    properties:
                      slug:
                        type: string
                      flag:
                        type: string
        '422':
          description: The flag is unknown, the rating is outside 0.0-5.0, or the
            POS system is blank
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_flag
                    - invalid_rating
                    - invalid_pos_system
        '404':
          description: The slug names no prospect and the body carries no restaurant_name
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '503':
          description: The alert reached no queue; repeat the request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - alert_not_queued
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
