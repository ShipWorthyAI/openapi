      operationId: readInternalLandingPage
      description: |
        The payload PartnerPortal::SelfServe::LandingPagesController#show renders, served so the
        partner service can answer the same public path without holding the columns it is built
        from. data is returned verbatim and is not a stable projection: it is whatever
        SelfServe::LandingPagePresenter emits, and the consumer forwards the bytes rather than
        re-serializing them.
        Only a prospect with landing_page_published = true is served; anything else is a 404
