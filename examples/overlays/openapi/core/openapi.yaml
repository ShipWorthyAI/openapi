        Membership is an `is_subscriber_manager` brand ownership on a brand in this project.
        No portal permission slug substitutes for one, `partner_marketing_permission`
        included, and there is no platform admin bypass. It is the same set the access route
        reports as the `marketing` capability, read from the same policy method, so a caller
        cleared to open the page and the rows it is then served cannot describe different
        brands.

        Ordered by name, and the sibling list route pages within whichever brand it answers
        for, so the first entry here is the one that route opens on.

        Never cached: a withdrawn brand ownership has to leave the dropdown on the next read.
