                  count:
                    type: integer
                    description: Pagy's count of the same relation.
                  page:
                    type: integer
                  prev:
                    type: integer
                    nullable: true
                  next:
                    type: integer
                    nullable: true
                    description: Null on the page `last` names.
                  last:
