      responses:
        '200':
          description: The prospect-visible accounts
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - account_name
                      - use_for_fund_requests
                      - source
                      - status
                      - connectable_type
                      - connectable_id
                      properties:
                        id:
                          type: integer
                        bank_name:
                          type: string
                          nullable: true
                        account_name:
                          type: string
                          nullable: true
                        account_type:
                          type: string
                          nullable: true
                        display_account_type:
                          type: string
                          nullable: true
                        masked_ach_number:
                          type: string
                          nullable: true
                          description: Null for a wire-only account, which is not
                            the same as an empty string.
                        account_mask:
                          type: string
                          nullable: true
                        use_for_fund_requests:
                          type: boolean
                        source:
                          type: string
                          description: plaid or manual. Manual is ~35% of production
