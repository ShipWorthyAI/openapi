  "/internal/v1/hotel-payments/authorize":
    post:
      summary: Authorize the immutable quoted hotel total on a saved card
      operationId: authorizeHotelPayment
      tags:
      - Hotels payments
      security:
      - hotelsServiceToken: []
      description: |
        Booking id is the durable idempotency key. Replays must contain identical user, source and money.
        Only authorized permits supplier booking. Authentication-required cards fail before supplier booking;
        3DS is unsupported. Unknown provider results return 503 and must be retried with the same booking id.
      parameters: []
      responses:
        '200':
          description: Current payment state
          content:
            application/json:
              schema:
                type: object
                required:
                - booking_id
                - payment_reference
                - state
                - total
                - cashback
                - authorization_expires_at
                - failure
                properties:
                  booking_id:
                    type: string
                  payment_reference:
                    type: string
                  state:
                    type: string
                    enum:
                    - pending
                    - authorized
                    - captured
                    - released
                    - failed
                  total:
                    type: object
                    additionalProperties: false
                    required:
                    - amount
                    - currency
                    properties:
                      amount:
                        type: integer
                        format: int64
                        minimum: 0
                        maximum: 99999999
                      currency:
                        type: string
                        enum:
                        - USD
                  cashback:
                    type: object
                    additionalProperties: false
                    required:
                    - amount
                    - currency
                    properties:
                      amount:
                        type: integer
                        format: int64
                        minimum: 0
                        maximum: 99999999
                      currency:
                        type: string
                        enum:
                        - USD
                  authorization_expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  failure:
                    type: object
                    nullable: true
                    required:
                    - code
                    properties:
                      code:
                        type: string
                        enum:
                        - authentication_required
                        - payment_declined
                        - authorization_expired
                        - payment_failed
        '401':
          description: Unauthorized Hotels service
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '409':
          description: Booking id was already used for different immutable inputs
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '422':
          description: Invalid request or saved source unavailable to this user
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '503':
          description: Payment outcome unknown; retry the same operation
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - booking_id
              - user_id
              - payment_source_id
              - total
              - cashback
              - supplier_cost
              properties:
                booking_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: "^[A-Za-z0-9_-]+$"
                user_id:
                  type: string
                  pattern: "^[1-9][0-9]{0,18}$"
                payment_source_id:
                  type: string
                  pattern: "^[1-9][0-9]{0,18}$"
                total:
                  type: object
                  additionalProperties: false
                  required:
                  - amount
                  - currency
                  properties:
                    amount:
                      type: integer
                      format: int64
                      minimum: 1
                      maximum: 99999999
                    currency:
                      type: string
                      enum:
                      - USD
                cashback:
                  type: object
                  additionalProperties: false
                  required:
                  - amount
                  - currency
                  properties:
                    amount:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 99999999
                    currency:
                      type: string
                      enum:
                      - USD
                supplier_cost:
                  type: object
                  additionalProperties: false
                  required:
                  - amount
                  - currency
                  properties:
                    amount:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 99999999
                    currency:
                      type: string
                      enum:
                      - USD
        required: true
