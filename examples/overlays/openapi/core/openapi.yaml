            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_stage
                    - invalid_request
        '404':
          description: The slug names no prospect, or was not sent as a string
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '429':
          description: The 30/minute alert budget for this calling application is
            spent. Retry with backoff. NOTE this body does not use the seam's envelope
            — it comes from Rack::Attack and carries an `errors` array with no Content-Type
            header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
        '500':
          description: An unhandled error; the namespace rescues StandardError so
            this keeps the envelope rather than answering an HTML error page
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - internal_error
        '403':
          description: The token is accessible but lacks the partner_service scope;
            no body
        '401':
          description: A token carrying a resource owner, or from another application
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - slug
              - stage
              properties:
                slug:
                  type: string
                  description: The prospect's slug.
                stage:
                  type: string
                  enum:
                  - post_failed
                  - posted_not_recorded
                  - declined
                  - unresolved_claim
                  description: Which of the four messages to raise.
                detail:
