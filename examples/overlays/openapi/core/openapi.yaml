        page opens on a project and learns its brand list from this answer, so a brand-keyed
        read would have the caller fetch a roster first, call once per brand, and rebuild
        this payload out of the pieces.

        Reaching it takes `partner_admin` on the project, with the platform admin bypass. That
        is the rule the partner-facing page applies, and the access route reports it as the
        `operations` capability.

