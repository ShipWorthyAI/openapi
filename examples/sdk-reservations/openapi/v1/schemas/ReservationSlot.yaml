type: object
required:
  - id
  - project_location_id
  - provider
  - guests
  - timestamp
  - seating
  - payment
properties:
  id:
    type: string
    description: Opaque reservation slot identifier with the slot_ prefix
  project_location_id:
    type: string
    pattern: ^[1-9][0-9]*$
    description: Core project location ID
  provider:
    $ref: ./ReservationProvider.yaml
  guests:
    type: integer
    description: Number of guests in the party
    minimum: 1
    maximum: 20
    default: 1
  timestamp:
    type: string
    format: date-time
    description: Timestamp of the reservation slot
  seating:
    $ref: ./ReservationSeating.yaml
  payment:
    description: Payment requirements for the slot. Null when the total amount is zero and no credit card is required.
    oneOf:
      - type: "null"
      - $ref: ./ReservationPayment.yaml
