type: object
required:
  - id
  - name
  - environment
  - attributes
properties:
  id:
    type: string
    minLength: 1
    description: Opaque seating option identifier with the seat_ prefix
  name:
    type: [string, "null"]
    description: The name of the seating
  environment:
    type: [string, "null"]
    description: The environment of the seating
  attributes:
    type: array
    maxItems: 1
    items:
      type: string
    description: Attributes of the selected seating option.
