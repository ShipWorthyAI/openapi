type: object
description: Credit card or payment requirement. The total amount is zero when no deposit is required.
required:
  - description
  - type
  - per
  - total
properties:
  description:
    type: string
    description: The description of the payment
  type:
    type: string
    description: The type of payment
    default: "deposit"
    enum:
      - "deposit"
      - "hold"
  per:
    type: string
    description: Charged per guest or reservation
    default: "reservation"
    enum:
      - "guest"
      - "reservation"
  total:
    $ref: ./Money.yaml
