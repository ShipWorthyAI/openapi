allOf:
  - $ref: ./ReservationSummary.yaml
  - type: object
    required:
      - slot_id
      - external_url
      - notes
      - payment
    properties:
      payment:
        description: Payment requirements captured from the reserved slot. Null when the slot has no payment requirements.
        x-inkind:
          opentable: "times_available[].availability_types[].cancellation_policy"
          sevenrooms:
            - "data.availability[].times[].require_credit_card"
            - "data.availability[].times[].cost"
        oneOf:
          - type: "null"
          - $ref: ./ReservationPaymentConfirmation.yaml
      slot_id:
        type: string
        description: Opaque inKind reservation slot identifier with the slot_ prefix
      external_url:
        type: string
        description: URL to the reservation on the provider's website
        x-inkind:
          opentable: "manage_reservation_url"
          sevenrooms: "data.manage_reservation_link"
      notes:
        type: string
        description: User written notes for the reservation
        x-inkind:
          opentable: "notes"
          sevenrooms: ["data.client_requests", "data.notes"]
